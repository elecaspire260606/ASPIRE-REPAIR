<style>

  /* ── Stats bar ── */
  .stats-bar { background: #FFFFFF; border-bottom: 1px solid #f2ede8; padding: 9px 14px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; position: sticky; top: 41px; z-index: 49; box-shadow: 0 1px 4px rgba(0,0,0,0.03); }

  .stats-refresh.spinning { animation: spin 0.7s linear; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  /* ── Pages ── */
  .page { display: none; padding: 20px 16px; max-width: 700px; margin: 0 auto; }
  .page.active { display: block; }

  /* ── Cards ── */
  .card { background: white; border-radius: 16px; box-shadow: 0 2px 16px rgba(0,0,0,0.07); overflow: hidden; margin-bottom: 16px; }

  /* ── Buttons ── */

  .lock-overlay { display:flex; align-items:center; justify-content:center; min-height:260px; }

  .case-card { background:white; border-radius:14px; box-shadow:0 2px 12px rgba(0,0,0,0.06); padding:15px; margin-bottom:11px; position:relative; }

  .btn-row { display:flex; gap:8px; margin-top:10px; }

  .stat-num.green { color:#2D7A3E; }
  .stat-num.navy { color:#1a3a5c; }

  .stat-num.red { color:#E0524D; }

  }

  .stat-label { font-size:12px; color:#bbb; margin-top:4px; font-weight:500; }

  /* ── Photo Upload ── */

// ── 位置標準化 ──
function normalizeLocation(raw) {
  if (!raw) return '';
  raw = String(raw);
  if (!raw.trim()) return '';
  let s = raw.trim();
  s = s.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0)-0xFEE0));
  const cnMap = {'零':0,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
  s = s.replace(/[一二三四五六七八九零十百]+/g, m => {
    let n = 0;
    if (m.includes('十')) {
      const parts = m.split('十');
      const left = parts[0] ? parts[0].split('').reduce((a,c)=>a*10+(cnMap[c]??0),0) : 1;
      const right = parts[1] ? parts[1].split('').reduce((a,c)=>a*10+(cnMap[c]??0),0) : 0;
      n = left*10 + right;
    } else {
      n = m.split('').reduce((a,c)=>a*10+(cnMap[c]??0),0);
    }
    return n>0 ? String(n) : m;
  });
  s = s.replace(/(\d+)\s*[樓层F]/g, '$1F');
  s = s.replace(/走道|廊道|通道/g, '走廊');
  s = s.replace(/厅/g, '廳');
  s = s.replace(/(\d+)\s*[號号]\s*[房室間]?/g, '$1');
  s = s.replace(/(\d+)\s*[室房間]/g, '$1');
  s = s.replace(/[、，,。.]\s*$/, '');
  s = s.replace(/\s+/g, ' ').trim();
  return s;
}

function showNormPreview() {
  const raw = document.getElementById('f-location').value;
  const norm = normalizeLocation(raw);
  const preview = document.getElementById('normPreview');
  if (norm && norm !== raw.trim()) {
    document.getElementById('normValue').textContent = norm;
    preview.style.display = 'block';
  } else { preview.style.display = 'none'; }
}

function requireAuth(id) {

function showLock() {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));

  const el = document.getElementById('page-lock');

async function checkPassword() {
  const pw = document.getElementById('pwInput').value;
  if (!pw) return;
  const btn = document.querySelector('#page-lock button');
  if (btn) { btn.textContent='驗證中…'; btn.disabled=true; }
  try {
    const r = await fetch(API_URL, {
      method:'POST',
      body: JSON.stringify({ action:'auth', password:pw })
    });
    const data = await r.json();
    if (btn) { btn.textContent='確認'; btn.disabled=false; }
    if (data.success) {
      sessionStorage.setItem('adminToken', data.token);
      document.getElementById('page-lock').style.display='none';
      document.getElementById('logoutBtn').style.display='flex';
      switchPage(pendingPage||'mgr'); pendingPage=null;
    } else {
      document.getElementById('pwErr').textContent='密碼錯誤，請再試一次';
      document.getElementById('pwInput').value='';
      document.getElementById('pwInput').focus();
    }
  } catch(e) {
    if (btn) { btn.textContent='確認'; btn.disabled=false; }
    document.getElementById('pwErr').textContent='網路異常，請重試';
  }
}

  if (id === 'dash' || id === 'query') loadCases(false, 'all'); // 統計跟查詢需要完整歷史資料才會準確
  else if (id === 'mgr') loadCases(); // 修繕管理預設用近期窗口即可(待處理案件本來就一律完整)
}

// ── 送出報修 ──
async function submitForm() {
  const unit = document.getElementById('f-unit').value.trim();
  const name = document.getElementById('f-name').value.trim();
  const area = document.getElementById('f-area').value;
  const desc = document.getElementById('f-desc').value.trim();
  if (!unit) { showToast('請選擇申請單位'); return; }
  if (!name) { showToast('請填寫申請人姓名'); return; }
  if (!area) { showToast('請選擇區域'); return; }
  if (!locType) { showToast('請選擇位置類型'); return; }
  if (!desc) { showToast('請填寫故障狀況描述'); return; }
  if (area === '雅舍' && !selectedBuilding) { showToast('請選擇雅舍棟別'); return; }
  const locVal = document.getElementById('f-location').value.trim();
  if (!locVal) { showToast('請填寫詳細地點後再送出'); return; }
  if (locType === 'restaurant' || locType === 'facility') {
    // 快速按鈕帶入的也算，上面已確認 locVal 有值
  }
  const btn = document.getElementById('submitBtn');
  btn.disabled=true; btn.textContent='送出中…';
  try {
    const submitArea = selectedBuilding ? (area + selectedBuilding) : area;
    const isOfficeArea = (area === '研究園' || area === '智尊');
    const locTypeLabel = locType==='room' ? (isOfficeArea?'辦公室':'客房') : ({restaurant:'餐廳',facility:'設施',other:'公共區域／其他'}[locType]||'');
    const location = normalizeLocation(document.getElementById('f-location').value.trim());
    const email = document.getElementById('f-email').value.trim();
    const reportPhotos = (photoData.report||[]).filter(Boolean);
    // 不再送datetime，報修時間一律由後端記錄伺服器時間(手機時間可能不準，伺服器時間比較可靠)
    let response;
    try {
      response = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action:'submit', unit, name, area: submitArea, locationType:locTypeLabel, location, description:desc, email, reportPhotos, deviceFingerprint: getDeviceFingerprint() })
      });
    } catch (e) {
      console.error('submitForm 網路層錯誤:', e);
      throw new Error('網路目前不穩定，案件尚未送出，請再試一次');
    }
    const text = await response.text();
    if (!response.ok) {
      console.error('submitForm HTTP錯誤:', response.status, text);
      throw new Error('系統暫時無法連線，剛才填寫的內容仍保留，請稍後再試');
    }
    if (!text) {
      console.error('submitForm 回傳空內容');
      throw new Error('系統暫時忙碌，剛才填寫的內容仍保留，請稍後再試');
    }
    let data;
    try { data = JSON.parse(text); } catch (e) {
      console.error('submitForm JSON解析失敗:', text);
      throw new Error('系統暫時忙碌，剛才填寫的內容仍保留，請稍後再試');
    }
    if (data.success) {
      showToast('✓ '+data.message);
      ['f-unit','f-name','f-area','f-location','f-desc','f-email'].forEach(id=>document.getElementById(id).value='');
      photoData.report = [null, null];
      document.getElementById('report-slot-0').innerHTML = '<span class="photo-add">+</span>';
      document.getElementById('report-slot-1').innerHTML = '<span class="photo-add">+</span>';
      document.getElementById('loc-input-wrap').style.display='none';
      document.getElementById('normPreview').style.display='none';
      document.querySelectorAll('#unit-btn-row .loc-type-btn').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('#area-btn-row .loc-type-btn').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('#loctype-btn-row .loc-type-btn').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('#restaurant-quick-row .loc-type-btn').forEach(b=>b.classList.remove('active'));
      document.getElementById('restaurant-quick-row').style.display='none';
      document.querySelectorAll('#facility-quick-row .loc-type-btn').forEach(b=>b.classList.remove('active'));
      document.getElementById('facility-quick-row').style.display='none';
      document.getElementById('yashe-building-row').style.display='none';
      document.querySelectorAll('#yashe-building-row .loc-type-btn').forEach(b=>b.classList.remove('active'));
      selectedBuilding = '';
      document.getElementById('btn-room').textContent='🚪 客房';
      document.getElementById('f-unit').style.display='none';
      locType='';
    } else { showToast('錯誤：'+data.message); }
  } catch(e) { showToast('❌ ' + (e.message || '連線失敗，請檢查網路')); }
  btn.disabled=false; btn.textContent='送出報修申請';
}

// ── 載入案件 ──
async function loadCases(force, daysOverride) {
  const targetDays = daysOverride || casesRangeDays;
  // 判斷目前手上的資料夠不夠用：已經是全量的話什麼都夠；不是全量的話，天數範圍要大於等於本次需要的才算夠
  const alreadyHaveEnough = lastLoadedDays === 'all' || (lastLoadedDays !== null && targetDays !== 'all' && lastLoadedDays >= targetDays);
  // 節流：8秒內剛讀取過「足夠的資料」就不重複打後端，避免頻繁切換分頁時對Google Apps Script連續發出重複請求
  // (Apps Script在短時間內收到大量重複請求容易變慢或逾時，會被誤以為是網路斷線)
  if (!force && alreadyHaveEnough && Date.now() - lastCasesLoadTime < 8000 && allCases.length) {
    renderCurrentPage(); // 資料還新鮮，直接用手上的資料渲染目前分頁，不用重打API，也不會讓切換分頁後畫面空白
    return;
  }
  try {
    const res = await fetch(API_URL+'?action=getAll&days='+targetDays);
    const data = await res.json();
    if (data.success) {
      allCases = data.cases.reverse();
      casesHasMore = !!data.hasMore;
      lastLoadedDays = targetDays;
      lastCasesLoadTime = Date.now();
      renderCurrentPage(); // 只渲染目前所在的分頁，不會四個分頁一起重畫
    }
  } catch(e) {
    console.error('loadCases 失敗:', e);
    document.getElementById('caseList').innerHTML='<div class="empty-state">載入失敗，請稍後再試（若持續發生可能是伺服器忙碌，非您的網路問題）</div>';
  }
}

// 載入更早的已結案案件：每次多擴大10天範圍再重新讀取
async function loadMoreHistory(btn) {
  if (btn) { btn.disabled = true; btn.textContent = '載入中…'; }
  casesRangeDays += 10;
  await loadCases(true);
}

// ── 修繕管理 ──
let mgrSearchDebounceTimer = null;
function onMgrSearchInput() {
  const val = document.getElementById('mgrSearchInput').value;
  document.getElementById('mgrSearchClear').style.display = val ? 'block' : 'none';
  clearTimeout(mgrSearchDebounceTimer); // 取消上一個還沒執行的計時器，避免舊的延遲結果蓋掉新的
  mgrSearchDebounceTimer = setTimeout(() => {
    mgrPage = 1;
    renderCases();
  }, 250);
}

function clearMgrSearch() {
  clearTimeout(mgrSearchDebounceTimer); // 清除按鈕要立即生效，不用等debounce
  document.getElementById('mgrSearchInput').value = '';
  document.getElementById('mgrSearchClear').style.display = 'none';
  mgrPage = 1;
  renderCases();
}

function filterMgrArea(area, btn) {
  currentMgrArea = area;
  mgrPage = 1;
  document.querySelectorAll('#mgr-area-row .filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderCases();
}

function filterCases(status, btn) {
  currentFilter=status; mgrPage=1;
  document.querySelectorAll('#page-mgr .filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderCases(); // 已結案也用近期窗口就好，不用一開啟就強制抓全部歷史，想看更早的用「載入更早案件」按鈕
}

function renderCases() {
  const list = document.getElementById('caseList');
  let filtered = allCases.filter(c=>c.status===currentFilter);
  if (currentMgrArea!=='all') filtered=filtered.filter(c=>areaMatchesFilter(effArea(c),currentMgrArea));
  const mgrSearchKeyword = (document.getElementById('mgrSearchInput')?.value || '').trim().toLowerCase();
  if (mgrSearchKeyword) {
    filtered = filtered.filter(c => {
      const haystack = [
        c.caseId, c.area, effArea(c), c.location, c.normalizedLocation,
        c.description, c.name, c.unit, c.locationType, c.caseType, c.repairNote
      ].filter(Boolean).join(' ').toLowerCase();
      return haystack.includes(mgrSearchKeyword);
    });
  }
  if (currentFilter==='已結案') {
    const toTs = (c) => {
      const raw = c.closeDatetime || c.datetime || c.date || '';
      if (!raw) return 0;
      const s = String(raw).trim();
      // ISO 格式 (含 T 或 Z) 直接解析，不做斜線替換
      if (/T.*Z?$|^\d{4}-\d{2}-\d{2}T/.test(s)) {
        const d = new Date(s);
        return isNaN(d) ? 0 : d.getTime();
      }
      const d = new Date(s.replace(/-/g,'/'));
      return isNaN(d) ? 0 : d.getTime();
    };
    filtered = [...filtered].sort((a,b)=> toTs(b) - toTs(a));
  }
  if (!filtered.length) { list.innerHTML='<div class="empty-state">目前沒有案件</div>'; document.getElementById('mgrPagination').innerHTML=''; renderLoadMoreBtn('mgrLoadMoreWrap'); return; }
  const totalPages = Math.ceil(filtered.length/PAGE_SIZE);
  if (mgrPage>totalPages) mgrPage=totalPages;
  const paged = filtered.slice((mgrPage-1)*PAGE_SIZE, mgrPage*PAGE_SIZE);

  list.innerHTML = paged.map(c => {
    const isFlagged = !!c.flagReason;
    const area = effArea(c);
    const areaClass = area.startsWith('會館') ? 'area-館' : area.startsWith('雅舍') ? 'area-雅' : area.startsWith('研究') ? 'area-研' : area.startsWith('智尊') ? 'area-智' : 'area-其';
    const cls = (isFlagged ? 'case-card is-flagged' : currentFilter==='已結案' ? 'case-card is-closed' : 'case-card') + ' ' + areaClass;
    const locDisplay = c.normalizedLocation || c.location || '—';
    const titleHtml = `${c.area} · ${locDisplay}${c.locationType ? ' <span style="font-size:11px;background:#FEF0E3;color:#C05E0A;padding:2px 8px;border-radius:20px;font-weight:600;">'+c.locationType+'</span>' : ''}`;
    const badgeHtml = `<span class="badge ${isFlagged?'flagged':c.status==='待處理'?'pending':'done'}">${isFlagged?'已標記':c.status}</span>`;
    const photosHtml = `
      ${(c.reportPhotoCount||(c.reportPhotos&&c.reportPhotos.length))?`<div class="photo-count-hint">📷 報修照片 ${c.reportPhotoCount||c.reportPhotos.length} 張（點開查看）</div>`:''}
      ${(c.closePhotoCount||(c.closePhotos&&c.closePhotos.length))?`<div class="photo-count-hint">📷 結案照片 ${c.closePhotoCount||c.closePhotos.length} 張（點開查看）</div>`:''}
    `;
    const timeBadges = `${dateBadge('📝報修', c.datetime||c.date, '#FEF0E3', '#C05E0A')}${c.status==='已結案'?dateBadge('✅結案', c.closeDatetime, '#E6F4EA', '#1E7A3E'):''}`;

    const reportBtnHtml = (c.status==='已結案' && !isFlagged) ? `<button class="ppt-btn" onclick="event.stopPropagation();generateReport(${c.rowIndex},this)">📊 生成報告</button>` : '';

    const stampHtml = isFlagged ? `<div class="flag-stamp">${c.flagReason||'已標記'}</div>` : '';

    const collapsedView = `
      <div class="case-collapsed" id="collapsed-${c.rowIndex}" onclick="toggleCardEdit(${c.rowIndex})">
        ${stampHtml}
        <div class="case-top">

      </div>`;

    const expandedView = `

                return `<button class="flag-btn${isActive?' active-flag':''}" style="${style}" onclick="toggleLocType(${c.rowIndex},'${matchVal}',this)" title="${isOriginal?'報修人原始值，點擊確認更正':''}">${label}</button>`;

          </div>
        </div>
      </div>
      </div>`;

    return `<div class="${cls}">${collapsedView}${expandedView}</div>`;
  }).join('');


  renderPagination('mgrPagination', mgrPage, totalPages, p=>{mgrPage=p;renderCases();});
  renderLoadMoreBtn('mgrLoadMoreWrap');
  prefetchPhotosForCases(paged); // 背景自動把這一頁看得到的案件照片抓回來，不用手動點
}

// 共用：純顯示用的照片區塊(案件查詢/鑽取彈窗)。還沒載入時顯示可點擊的張數提示，點了才真的去抓照片網址。
function photoDisplayBlock(c, kind, label) {
  const photos = kind === 'report' ? c.reportPhotos : c.closePhotos;
  const count = kind === 'report' ? (c.reportPhotoCount||0) : (c.closePhotoCount||0);
  if (photos !== undefined) {
    return photos.length ? `<div style="margin-top:8px;font-size:11px;color:#aaa;">${label}：</div><div class="photo-preview-wrap">${photos.map(url=>`<img class="photo-preview-img" src="${url}" onclick="window.open('${url}')">`).join('')}</div>` : '';
  }
  if (!count) return '';
  return `<div class="photo-count-hint" style="cursor:pointer;" onclick="loadAndShowPhotos(${c.rowIndex},this,'${kind}')">📷 ${label} ${count} 張（點擊查看）</div>`;
}

// 點擊張數提示時才真的去抓這筆案件的照片，抓到後直接把提示換成實際照片
// 背景批次預抓照片：清單渲染完後自動呼叫，一次把「這一頁看得到的案件」的照片都抓回來，
// 不用等使用者點擊，也不會一張案件各打一次getPhotos(那樣才會常常卡住)
let photoPrefetchInFlight = new Set(); // 記錄正在抓取中的rowIndex，避免同一批被重複觸發
async function prefetchPhotosForCases(casesArr) {
  const targets = casesArr.filter(c =>
    c.reportPhotos === undefined &&
    (c.reportPhotoCount || c.closePhotoCount) &&
    !photoPrefetchInFlight.has(c.rowIndex)
  );
  if (!targets.length) return;
  targets.forEach(c => photoPrefetchInFlight.add(c.rowIndex));
  try {
    const rowIndexes = targets.map(c => c.rowIndex).join(',');
    const res = await fetch(API_URL+'?action=getPhotosForRows&rowIndexes='+rowIndexes);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    if (!text) throw new Error('回應內容為空');
    const data = JSON.parse(text);
    if (data.success) {
      targets.forEach(c => {
        const p = data.photos[c.rowIndex];
        if (p) {
          c.reportPhotos = p.reportPhotos;
          c.closePhotos = p.closePhotos;
          renderCasePhotoSlots(c); // 修繕管理展開視圖若剛好開著，順便更新
        }
      });
      // 若鑽取詳情面板剛好開著、顯示的正是這筆案件，直接重新整個面板(格式含分隔線/標籤比較完整)
      const panelOpen = document.getElementById('caseDetailPanel').classList.contains('open');
      const panelCaseId = document.getElementById('panelCaseId').textContent;
      targets.forEach(c => {
        if (c.reportPhotos === undefined) return;
        if (panelOpen && panelCaseId === c.caseId) {
          openCasePanel(c);
          return;
        }
        // 其餘情況(修繕管理清單/案件查詢卡片)：悄悄局部更新張數提示，換成實際縮圖，不整頁重繪
        document.querySelectorAll(`[onclick*="loadAndShowPhotos(${c.rowIndex},"]`).forEach(hintEl => {
          const kindMatch = hintEl.getAttribute('onclick').match(/'(\w+)'\)$/);
          const kind = kindMatch ? kindMatch[1] : 'report';
          const label = kind === 'report' ? '報修照片' : '結案照片';
          const wrap = document.createElement('div');
          wrap.innerHTML = photoDisplayBlock(c, kind, label);
          if (wrap.childNodes.length) hintEl.replaceWith(...wrap.childNodes);
        });
      });
    }
  } catch(e) {
    console.error('prefetchPhotosForCases 失敗:', e);
    // 背景預抓失敗不用特別提示使用者，畫面上的「點擊查看」提示還在，仍可手動點擊重試
  } finally {
    targets.forEach(c => photoPrefetchInFlight.delete(c.rowIndex));
  }
}

async function loadAndShowPhotos(rowIndex, hintEl, kind) {
  const c = allCases.find(x => x.rowIndex === rowIndex);
  if (!c) return;
  const label = kind === 'report' ? '報修照片' : '結案照片';

  // 另一種類型可能已經被點過、資料已經在記憶體裡了，這種情況不用再打API，直接渲染
  const alreadyLoaded = kind === 'report' ? c.reportPhotos !== undefined : c.closePhotos !== undefined;
  if (alreadyLoaded) {
    const wrap = document.createElement('div');
    wrap.innerHTML = photoDisplayBlock(c, kind, label);
    hintEl.replaceWith(...wrap.childNodes);
    return;
  }

  hintEl.textContent = '載入中…';
  try {
    const res = await fetch(API_URL+'?action=getPhotos&rowIndex='+rowIndex);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    if (!text) throw new Error('回應內容為空');
    const data = JSON.parse(text);
    if (data.success) {
      c.reportPhotos = data.reportPhotos;
      c.closePhotos = data.closePhotos;
      const wrap = document.createElement('div');
      wrap.innerHTML = photoDisplayBlock(c, kind, label); // 只換掉被點擊的這一種，不動另一種的提示
      hintEl.replaceWith(...wrap.childNodes);
    } else {
      hintEl.textContent = '⚠️ 載入失敗（點擊重試）：' + (data.message||'未知錯誤');
    }
  } catch(e) {
    console.error('loadAndShowPhotos 失敗:', e);
    hintEl.textContent = '⚠️ 照片載入失敗（點擊重試）';
  }
}

// 照片改成「點開才載入」：清單本身只給張數，真的展開某張案件卡片時才另外打一次輕量請求拿實際網址
async function ensureCasePhotosLoaded(rowIndex) {
  const c = allCases.find(x => x.rowIndex === rowIndex);
  if (!c || c.closePhotos !== undefined) return; // undefined代表還沒抓過；已經抓過就不重複打
  try {
    const res = await fetch(API_URL+'?action=getPhotos&rowIndex='+rowIndex);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    if (!text) throw new Error('回應內容為空');
    const data = JSON.parse(text);
    if (data.success) {
      c.reportPhotos = data.reportPhotos;
      c.closePhotos = data.closePhotos;
      renderCasePhotoSlots(c);
    } else {
      console.error('getPhotos 回傳失敗:', data.message);
      renderCasePhotoSlotsError(rowIndex);
    }
  } catch(e) {
    console.error('getPhotos 失敗:', e);
    renderCasePhotoSlotsError(rowIndex);
  }
}

// 照片載入失敗時，展開視圖的照片欄位顯示可重試的錯誤狀態，不會卡在「…」載入中永遠不動
function renderCasePhotoSlotsError(rowIndex) {
  const slot0 = document.getElementById(`close-slot-${rowIndex}-0`);
  const slot1 = document.getElementById(`close-slot-${rowIndex}-1`);
  const retryHtml = `<span class="photo-loading" style="cursor:pointer;font-size:11px;" onclick="event.stopPropagation();retryLoadCasePhotos(${rowIndex})">⚠️ 重試</span>`;
  if (slot0) slot0.innerHTML = retryHtml;
  if (slot1) slot1.innerHTML = '';
  const wrap = document.getElementById(`reportPhotosWrap-${rowIndex}`);
  if (wrap) wrap.innerHTML = `<div style="font-size:11px;color:#e05252;margin-top:8px;cursor:pointer;" onclick="retryLoadCasePhotos(${rowIndex})">⚠️ 報修照片載入失敗，點擊重試</div>`;
}

function retryLoadCasePhotos(rowIndex) {
  const c = allCases.find(x => x.rowIndex === rowIndex);
  if (c) { c.reportPhotos = undefined; c.closePhotos = undefined; } // 重設成「未載入」狀態，讓ensureCasePhotosLoaded願意重抓
  const slot0 = document.getElementById(`close-slot-${rowIndex}-0`);
  const slot1 = document.getElementById(`close-slot-${rowIndex}-1`);
  if (slot0) slot0.innerHTML = '<span class="photo-loading">…</span>';
  if (slot1) slot1.innerHTML = '<span class="photo-loading">…</span>';
  const wrap = document.getElementById(`reportPhotosWrap-${rowIndex}`);
  if (wrap) wrap.innerHTML = '<div style="font-size:11px;color:#ccc;margin-top:8px;">照片載入中…</div>';
  ensureCasePhotosLoaded(rowIndex);
}

// 把剛拿到的照片網址，局部更新進展開視圖的照片欄位(不整頁重繪，避免打斷正在編輯的其他卡片)
function renderCasePhotoSlots(c) {
  const slot0 = document.getElementById(`close-slot-${c.rowIndex}-0`);
  const slot1 = document.getElementById(`close-slot-${c.rowIndex}-1`);
  if (slot0) slot0.innerHTML = c.closePhotos[0]
    ? `<img src="${c.closePhotos[0]}"><div class="photo-del" onclick="event.stopPropagation();removePhoto('close-${c.rowIndex}',0)">×</div>`
    : '<span class="photo-add">+</span>';
  if (slot1) slot1.innerHTML = c.closePhotos[1]
    ? `<img src="${c.closePhotos[1]}"><div class="photo-del" onclick="event.stopPropagation();removePhoto('close-${c.rowIndex}',1)">×</div>`
    : '<span class="photo-add">+</span>';
  const wrap = document.getElementById(`reportPhotosWrap-${c.rowIndex}`);
  if (wrap) {
    wrap.innerHTML = c.reportPhotos.length
      ? `<div style="margin-top:8px;font-size:11px;color:#aaa;">報修照片：</div><div class="photo-preview-wrap">${c.reportPhotos.map((url,idx)=>`<div style="position:relative;display:inline-block;"><img class="photo-preview-img" src="${url}" onclick="window.open('${url}')"><div class="photo-del" onclick="event.stopPropagation();deleteReportPhoto(${c.rowIndex},${idx})">×</div></div>`).join('')}</div>`
      : '';
  }
}

async function autoCloseAsFlagged(rowIndex, reason) {
  const labels = {重複報修:'重複報修', 寫錯:'填寫錯誤', 測試:'測試案件'};
  const label = labels[reason] || reason;
  if (!confirm(`確定標記為「${label}」並自動結案？此案件將移至已結案，不列入統計。`)) {
    const btns = document.getElementById('flags-'+rowIndex)?.querySelectorAll('.flag-btn');
    if (btns) btns.forEach(b=>b.classList.remove('active-flag'));
    return;
  }
  try {
    const data = await callApi({
      action: 'close',
      rowIndex,
      repairNote: '',
      normalizedLocation: '',
      flagReason: reason,
      caseType: '',
      correctedLocType: '',
      correctedArea: '',
      closerName: '',
      closePhotos: [],
      closeFingerprint: getDeviceFingerprint()
    });
    if (data.success) {
      showToast(`✓ 已標記「${label}」並結案`);
      await loadCases(true);
    } else {
      showToast('操作失敗：'+(data.message||'未知錯誤'));
    }
  } catch(e) {
    showToast('操作失敗，請檢查網路');
  }
}

async function updateCase(rowIndex) {
  const note = document.getElementById('note-'+rowIndex).value;
  const norm = document.getElementById('norm-'+rowIndex).value;
  const flag = getSelectedFlag(rowIndex);
  const caseType = getSelectedCaseType(rowIndex);
  const correctedLocType = getSelectedLocType(rowIndex);
  const correctedArea = getSelectedArea(rowIndex);
  const closerName = getSelectedCloser(rowIndex);
  const closePhotos = getClosePhotos(rowIndex);
  const btn = document.querySelector(`[onclick="updateCase(${rowIndex})"]`);
  if (btn) { btn.disabled=true; btn.textContent='更新中…'; }
  try {
    const data = await callApi({action:'update', rowIndex, repairNote:note, normalizedLocation:norm, flagReason:flag, caseType, correctedLocType, correctedArea, closerName, closePhotos});
    if (data && data.success) { showToast('✓ 已更新案件狀況'); loadCases(true); }
    else { showToast('❌ 更新失敗，請重試'); }
  } catch(e) { showToast('❌ ' + (e.message || '連線失敗，請檢查網路')); }
  if (btn) { btn.disabled=false; btn.textContent='更新案件狀況'; }
}
async function closeCase(rowIndex) {
  const note = document.getElementById('note-'+rowIndex).value;
  const norm = document.getElementById('norm-'+rowIndex).value;
  const flag = getSelectedFlag(rowIndex);
  const caseType = getSelectedCaseType(rowIndex);
  if (!caseType) { showToast('請選擇案件類型'); return; }
  const correctedLocType = getSelectedLocType(rowIndex);
  const correctedArea = getSelectedArea(rowIndex);
  const closerName = getSelectedCloser(rowIndex);
  if (!closerName) { showToast('請選擇結案人'); return; }
  const closePhotos = getClosePhotos(rowIndex);
  const btn = document.querySelector(`[onclick="closeCase(${rowIndex})"]`);
  if (btn) { btn.disabled=true; btn.textContent='處理中…'; }
  try {
    const data = await callApi({action:'close', rowIndex, repairNote:note, normalizedLocation:norm, flagReason:flag, caseType, correctedLocType, correctedArea, closerName, closePhotos, closeFingerprint: getDeviceFingerprint()});
    if (data && data.success) { showToast('✓ 案件已結案'); loadCases(true); }
    else { showToast('❌ 結案失敗，請重試'); }
  } catch(e) { showToast('❌ ' + (e.message || '連線失敗，請檢查網路')); }
  if (btn) { btn.disabled=false; btn.textContent='結案'; }
}
async function reopenCase(rowIndex) {
  const btn = document.querySelector(`[onclick="reopenCase(${rowIndex})"]`);
  if (btn) { btn.disabled=true; btn.textContent='處理中…'; }
  try {
    const data = await callApi({action:'reopen', rowIndex});
    if (data && data.success) { showToast('✓ 已取消結案'); loadCases(true); }
    else { showToast('❌ 操作失敗，請重試'); }
  } catch(e) { showToast('❌ ' + (e.message || '連線失敗，請檢查網路')); }
  if (btn) { btn.disabled=false; btn.textContent='取消結案'; }
}
async function callApi(params) {
  const token = sessionStorage.getItem('adminToken');
  let response;
  try {
    response = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ ...params, token })
    });
  } catch (e) {
    console.error('callApi 網路層錯誤:', e);
    throw new Error('網路目前不穩定，請再試一次');
  }
  const text = await response.text();
  if (!response.ok) {
    console.error('callApi HTTP錯誤:', response.status, text);
    throw new Error('系統暫時無法連線，請稍後再試');
  }
  if (!text) {
    console.error('callApi 回傳空內容');
    throw new Error('系統暫時忙碌，請稍後再試');
  }
  try {
    return JSON.parse(text);
  } catch (e) {
    console.error('callApi JSON解析失敗:', text);
    throw new Error('系統暫時忙碌，請稍後再試');
  }
}

function enterGmMode(areaScope) {

  currentQueryAreaScope = areaScope || null; // 若有指定(如['會館','雅舍'])，只顯示這些區域，不受區域篩選鈕影響
  currentQueryFilter = '待處理'; // 進入時預設顯示待處理
  currentQueryArea = 'all';
  queryPage = 1;
  document.getElementById('query-name-mode').style.display = 'none';
  document.getElementById('query-gm-mode').style.display = 'block';
  document.querySelectorAll('#query-gm-mode [data-status]').forEach(b=>b.classList.remove('active'));
  const pendingBtn = document.querySelector('#query-gm-mode [data-status="待處理"]');
  if (pendingBtn) pendingBtn.classList.add('active');
  const areaRow = document.getElementById('query-area-row');
  if (areaRow) {
    areaRow.style.display = 'flex';
    areaRow.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    const allAreaBtn = areaRow.querySelector('.filter-btn');

function renderQueryGm() {
  const list = document.getElementById('queryListGm');
  let filtered = allCases;
  if (currentQueryFilter!=='all') filtered=filtered.filter(c=>c.status===currentQueryFilter);
  // 範圍鎖定(如營運快捷字設定的會館+雅舍)永遠是外層邊界，不管區域按鈕怎麼點都不會超出這個範圍
  if (currentQueryAreaScope) {
    filtered = filtered.filter(c => currentQueryAreaScope.some(a => areaMatchesFilter(effArea(c), a)));
    // 新規則：營運範圍檢視不顯示「園區營繕」單位自己報修的工單
    filtered = filtered.filter(c => c.unit !== '園區營繕');
  }
  if (currentQueryArea!=='all') {
    filtered=filtered.filter(c=>areaMatchesFilter(effArea(c),currentQueryArea));
  }
  const kw = currentQueryKeyword.toLowerCase();
  if (kw) {
    filtered = filtered.filter(c => {
      const haystack = [
        c.caseId, c.area, effArea(c), c.location, c.normalizedLocation,
        c.description, c.name, c.unit, c.locationType, c.caseType, c.repairNote
      ].filter(Boolean).join(' ').toLowerCase();
      return haystack.includes(kw);
    });
  }
  if (!filtered.length) { list.innerHTML='<div class="empty-state">目前沒有案件</div>'; document.getElementById('queryPaginationGm').innerHTML=''; renderLoadMoreBtn('queryLoadMoreWrap'); return; }
  const totalPages = Math.ceil(filtered.length/PAGE_SIZE);
  if (queryPage>totalPages) queryPage=totalPages;
  const paged = filtered.slice((queryPage-1)*PAGE_SIZE, queryPage*PAGE_SIZE);
  list.innerHTML = paged.map(c => renderPubCard(c)).join('');
  renderPagination('queryPaginationGm', queryPage, totalPages, p=>{queryPage=p;renderQueryGm();});

  prefetchPhotosForCases(paged);
}

// ── 分頁 ──
function renderPagination(containerId, current, total, onChange) {
  const el = document.getElementById(containerId);
  if (total<=1) { el.innerHTML=''; return; }
  let html = `<button class="page-btn" ${current===1?'disabled':''} onclick="paginationGo('${containerId}',${current-1})">‹</button>`;
  for (let i=1; i<=total; i++) {
    if (total>7 && i>2 && i<total-1 && Math.abs(i-current)>1) {
      if (i===3||i===total-2) html+=`<span class="page-ellipsis">…</span>`;
      continue;
    }
    html+=`<button class="page-btn${i===current?' active':''}" onclick="paginationGo('${containerId}',${i})">${i}</button>`;
  }
  html+=`<button class="page-btn" ${current===total?'disabled':''} onclick="paginationGo('${containerId}',${current+1})">›</button>`;
  el.innerHTML=html;
  el._onChange = onChange;
}

function paginationGo(containerId, page) {
  const el = document.getElementById(containerId);
  if (el && el._onChange) {
    el._onChange(page);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function formatDatetime(raw) {
  if (!raw) return '';
  const weekdays = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  // Try to parse
  const m = String(raw).match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if (m) {
    const d = new Date(parseInt(m[1]), parseInt(m[2])-1, parseInt(m[3]));
    const day = weekdays[d.getDay()];
    return `${m[1]}/${String(m[2]).padStart(2,'0')}/${String(m[3]).padStart(2,'0')} ${day}`;
  }
  // GMT string fallback
  const d = new Date(raw);
  if (!isNaN(d)) {
    const y = d.getFullYear();
    const mo = String(d.getMonth()+1).padStart(2,'0');
    const dd = String(d.getDate()).padStart(2,'0');
    const day = weekdays[d.getDay()];
    return `${y}/${mo}/${dd} ${day}`;
  }
  return raw;
}

function dateBadge(label, dateStr, bg, color) {
  if (!dateStr) return '';
  return `<span style="display:inline-flex;align-items:center;gap:4px;background:${bg};color:${color};font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;margin-right:6px;">${label} ${formatDatetime(dateStr)}</span>`;
}

function parseDate(raw) {
  if (!raw) return null;
  const m1 = String(raw).match(/(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);
  if (m1) return new Date(parseInt(m1[1]), parseInt(m1[2])-1, parseInt(m1[3]));
  const d = new Date(raw);
  return isNaN(d) ? null : d;
}

function getFilteredCases() {
  const now = new Date();
  let valid = allCases.filter(c=>!c.flagReason);
  if (currentAreaDashFilter!=='all') valid = valid.filter(c=>areaMatchesFilter(effArea(c),currentAreaDashFilter));
  if (currentTimeFilter==='all') return valid;
  return valid.filter(c=>{
    const raw = c.datetime||c.date||'';
    const d = parseDate(raw);
    if (!d) return true;
    const mMatch = currentTimeFilter.match(/^m(\d+)$/);
    if (mMatch) {
      const m = parseInt(mMatch[1]);
      return d.getFullYear()===currentYear && d.getMonth()+1===m;
    }
    if (currentTimeFilter==='custom') {
      const from=document.getElementById('dateFrom').value;
      const to=document.getElementById('dateTo').value;
      if (from&&d<new Date(from)) return false;
      if (to&&d>new Date(to+'T23:59:59')) return false;
      return true;
    }
    return true;
  });
}

// ── 圓餅圖 ──
function renderPieChart(containerId, counts, colors, total, clickHandler) {
  const el = document.getElementById(containerId);
  const entries = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  if (!entries.length) { el.innerHTML='<div class="empty-state" style="padding:20px 0;">暫無資料</div>'; return; }
  const sum = entries.reduce((a,b)=>a+b[1],0);
  const size = 160;
  const cx = size/2, cy = size/2, r = 68, innerR = 36;
  let startAngle = -Math.PI/2;
  let slices = '';
  entries.forEach(([label, val]) => {
    const angle = (val/sum)*Math.PI*2;
    const endAngle = startAngle + angle;
    const x1=cx+r*Math.cos(startAngle), y1=cy+r*Math.sin(startAngle);
    const x2=cx+r*Math.cos(endAngle), y2=cy+r*Math.sin(endAngle);
    const ix1=cx+innerR*Math.cos(startAngle), iy1=cy+innerR*Math.sin(startAngle);
    const ix2=cx+innerR*Math.cos(endAngle), iy2=cy+innerR*Math.sin(endAngle);
    const largeArc = angle > Math.PI ? 1 : 0;
    const color = colors[label]||'#bbb';
    const clickAttr = clickHandler ? ` style="cursor:pointer;" onclick="${clickHandler}('${label}')"` : '';
    slices += `<path d="M${ix1},${iy1} L${x1},${y1} A${r},${r} 0 ${largeArc},1 ${x2},${y2} L${ix2},${iy2} A${innerR},${innerR} 0 ${largeArc},0 ${ix1},${iy1} Z" fill="${color}" stroke="white" stroke-width="2"${clickAttr}/>`;
    startAngle = endAngle;
  });
  const legend = entries.map(([label,val])=>`
    <div class="pie-legend-item"${clickHandler?` style="cursor:pointer;" onclick="${clickHandler}('${label}')"`:''}>
      <div class="pie-legend-dot" style="background:${colors[label]||'#bbb'}"></div>
      <span class="pie-legend-label">${label}</span>
      <span class="pie-legend-val">${val}件 ${Math.round(val/sum*100)}%</span>
    </div>`).join('');
  el.innerHTML = `<div class="pie-wrap">
    <div class="pie-canvas-wrap">
      <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${slices}
        <text x="${cx}" y="${cy-6}" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">${sum}</text>
        <text x="${cx}" y="${cy+12}" text-anchor="middle" font-size="10" fill="#aaa">總案件</text>
      </svg>
    </div>
    <div class="pie-legend">${legend}</div>
  </div>`;
}

function getDeviceFingerprint() {
  const ua = navigator.userAgent;
  const lang = navigator.language || '';
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
  const screen = `${window.screen.width}x${window.screen.height}x${window.screen.colorDepth}`;
  const raw = [ua, lang, tz, screen].join('|');
  let hash = 0;
  for (let i = 0; i < raw.length; i++) {
    hash = ((hash << 5) - hash) + raw.charCodeAt(i);
    hash |= 0;
  }
  return 'FP' + Math.abs(hash).toString(16).toUpperCase().padStart(8,'0');
}

function downloadBackup() {
  if (!allCases || !allCases.length) { showToast('沒有可備份的資料'); return; }
  const payload = {
    exportedAt: new Date().toISOString(),
    count: allCases.length,
    cases: allCases
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const ts = new Date();
  const stamp = `${ts.getFullYear()}${String(ts.getMonth()+1).padStart(2,'0')}${String(ts.getDate()).padStart(2,'0')}_${String(ts.getHours()).padStart(2,'0')}${String(ts.getMinutes()).padStart(2,'0')}`;
  a.href = url;
  a.download = `渴望園區報修系統_備份_${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('✓ 備份已下載');
}

async function importBackup(file) {
  if (!file) return;
  if (!confirm('匯入備份將會把檔案內的所有案件還原到系統，可能與現有資料合併或覆蓋，確定要繼續嗎？')) {
    document.getElementById('backupFileInput').value = '';
    return;
  }
  try {
    const text = await file.text();
    const payload = JSON.parse(text);
    const cases = Array.isArray(payload) ? payload : payload.cases;
    if (!Array.isArray(cases) || !cases.length) { showToast('備份檔案格式錯誤或無資料'); return; }
    showToast('匯入中，請稍候…');
    const res = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action:'import', cases, token: sessionStorage.getItem('adminToken') })
    });
    const data = await res.json();
    if (data.success) {
      const skipMsg = data.skipped ? `，略過重複 ${data.skipped} 筆` : '';
      showToast('✓ 匯入完成，新增 '+data.imported+' 筆'+skipMsg);
      await loadCases(true);
    } else {
      showToast('匯入失敗：'+(data.message||'未知錯誤'));
    }
  } catch(e) {
    showToast('匯入失敗，檔案格式錯誤或連線問題');
  }
  document.getElementById('backupFileInput').value = '';
}

function renderDashboard() {
  const cases = getFilteredCases();
  dashboardCases = cases;
  const areaF = currentAreaDashFilter;
  const showCloserChart = sessionStorage.getItem('adminToken') === 'py5678';

  // 單一主要迴圈：一次遍歷計算全部統計數字(總數/待處理/已結案/各區域/位置類型/案件類型/結案人/位置病歷)
  // 取代原本對同一份cases分開跑好幾次filter/forEach的寫法
  let total = 0, pending = 0, done = 0, closedTotal = 0, closedWithCloserTotal = 0;
  const areaCounts = {};
  const locTypeCounts = {};
  const typeCounts = {};   // 只計已結案
  const closerCounts = {}; // 只計已結案且有結案人(僅密碼py5678需要，其他情況不浪費時間累計)
  const locMap = {};       // 位置病歷統計，依目前區域篩選(areaF)決定要不要納入

  cases.forEach(c => {
    total++;
    const isDone = c.status === '已結案';
    if (isDone) done++; else pending++;

    const area = effArea(c);
    areaCounts[area] = (areaCounts[area]||0) + 1;

    const lt = c.correctedLocType || c.locationType || '';
    if (lt) locTypeCounts[lt] = (locTypeCounts[lt]||0) + 1;

    if (isDone) {
      closedTotal++;
      const ct = normalizeCaseType(c.caseType);
      if (ct) typeCounts[ct] = (typeCounts[ct]||0) + 1;
      if (showCloserChart && c.closerName) {
        closedWithCloserTotal++;
        closerCounts[c.closerName] = (closerCounts[c.closerName]||0) + 1;
      }
    }

    // 位置病歷統計：只算目前區域篩選範圍內的案件(對應原本locCases那個子集合)
    if (areaF === 'all' || areaMatchesFilter(area, areaF)) {
      const loc = c.normalizedLocation || normalizeLocation(c.location) || '（未填位置）';
      const key = area + '|' + loc;
      if (!locMap[key]) locMap[key] = { area, loc, total:0, pending:0, done:0, cases:[] };
      locMap[key].total++;
      if (isDone) locMap[key].done++; else locMap[key].pending++;
      locMap[key].cases.push(c);
    }
  });

  document.getElementById('d-total').textContent=total;
  document.getElementById('d-pending').textContent=pending;
  document.getElementById('d-done').textContent=done;
  document.getElementById('d-rate').textContent=total>0?Math.round(done/total*100)+'%':'—';

  renderPieChart('areaChart', areaCounts, AREA_COLORS, total, 'drillByArea');

  const locEntries=Object.values(locMap).sort((a,b)=>b.total-a.total);
  locPagerMultiArea = new Set(locEntries.map(e=>e.area)).size > 1;
  locPagerMaxL=Math.max(...locEntries.map(e=>e.total),1);
  locPagerEntries = locEntries;
  locPagerPage = 0;
  renderLocPage();

  const locTypeColors = {'客房':'#E8761A','辦公室':'#E8761A','餐廳':'#3B82F6','設施':'#8B5CF6','公共區域／其他':'#aaa'};
  renderPieChart('locTypeChart', locTypeCounts, locTypeColors, total, 'drillByLocType');

  const typeColors = {'給排水':'#06B6D4','電力':'#F59E0B','消防':'#EF4444','空調':'#3B82F6','弱電':'#8B5CF6','電梯':'#EC4899','建物':'#10B981','木工':'#A0522D','鐵工':'#6B7280','照明':'#F97316','衛浴':'#14B8A6','庶務':'#A78BFA','其他':'#aaa'};
  renderPieChart('caseTypeChart', typeCounts, typeColors, closedTotal, 'drillByCaseType');

  // 結案人比例圖（限定密碼 py5678 才顯示）
  const closerChartWrap = document.getElementById('closerChartWrap');
  if (showCloserChart) {
    closerChartWrap.style.display = '';
    const closerColors = {};
    const palette = ['#E8761A','#1a3a5c','#2D7A3E','#8B5CF6','#EC4899','#06B6D4','#F59E0B','#14B8A6'];
    Object.keys(closerCounts).forEach((name,i)=>{ closerColors[name]=palette[i%palette.length]; });
    renderPieChart('closerChart', closerCounts, closerColors, closedWithCloserTotal, 'drillByCloser');
  } else {
    closerChartWrap.style.display = 'none';
  }

  document.getElementById('recentList').innerHTML=cases.slice(0,8).map(c=>`
    <div class="recent-item">
      <div>
        <div style="font-weight:600;color:#1a1a1a;">${c.area} · ${c.normalizedLocation||normalizeLocation(c.location)||'—'}</div>
        <div style="font-size:11px;color:#bbb;margin-top:2px;">${c.unit} · ${formatDatetime(c.datetime||c.date)}</div>
      </div>
      <span class="badge ${c.status==='待處理'?'pending':'done'}">${c.status}</span>
    </div>`).join('')||'<div class="empty-state">暫無資料</div>';
}

function setExportRange(range, btn) {
  exportRange = range;
  document.querySelectorAll('.export-range-btn').forEach(b => b.classList.remove('active-export'));
  btn.classList.add('active-export');
  document.getElementById('exportCustomRange').style.display = range === 'custom' ? 'block' : 'none';
}

function getExportCases() {
  const now = new Date();
  let cases = allCases.filter(c => !c.flagReason);
  if (exportRange === 'month') {
    cases = cases.filter(c => {
      const d = parseExportDate(c.datetime);
      return d && d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
    });
  } else if (exportRange === '3month') {
    cases = cases.filter(c => {
      const d = parseExportDate(c.datetime);
      return d && (now - d) <= 90*24*60*60*1000;
    });
  } else if (exportRange === 'custom') {
    const from = document.getElementById('exportDateFrom').value;
    const to = document.getElementById('exportDateTo').value;
    cases = cases.filter(c => {
      const d = parseExportDate(c.datetime);
      if (!d) return false;
      if (from && d < new Date(from)) return false;
      if (to && d > new Date(to + 'T23:59:59')) return false;
      return true;
    });
  }
  return cases;
}

function parseExportDate(raw) {
  if (!raw) return null;
  const m = String(raw).match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if (m) return new Date(parseInt(m[1]), parseInt(m[2])-1, parseInt(m[3]));
  const d = new Date(raw);
  return isNaN(d) ? null : d;
}

async function exportExcel() {
  const btn = document.getElementById('exportBtn');
  btn.textContent = '產生中…'; btn.disabled = true;

  const cases = getExportCases();
  const includeDetail = document.getElementById('exportIncludeDetail').checked;
  const now = new Date();
  const rangeLabel = {month:'本月', '3month':'近三個月', all:'全部'}[exportRange] || (() => {
    const from = document.getElementById('exportDateFrom').value;
    const to = document.getElementById('exportDateTo').value;
    const fmt = s => s ? s.replace(/-/g,'/') : '';
    return from || to ? `${fmt(from)} ～ ${fmt(to)}` : '自訂';
  })();

  const total = cases.length;
  const pending = cases.filter(c => c.status === '待處理').length;
  const done = cases.filter(c => c.status === '已結案').length;
  const rate = total > 0 ? Math.round(done/total*100) : 0;

  // 各棟統計
  const areaMap = {};
  cases.forEach(c => {
    const a = effArea(c);
    if (!areaMap[a]) areaMap[a] = {total:0, done:0, pending:0};
    areaMap[a].total++;
    if (c.status==='已結案') areaMap[a].done++; else areaMap[a].pending++;
  });
  const areas = Object.entries(areaMap)
    .sort((a,b)=>b[1].total-a[1].total)
    .map(([name, stat]) => ({
      name, total: stat.total, done: stat.done, pending: stat.pending,
      rate: stat.total>0 ? Math.round(stat.done/stat.total*100) : 0
    }));

  // 維修類別（已結案）
  const typeCounts = {};
  cases.filter(c=>c.status==='已結案').forEach(c => {
    const ct = normalizeCaseType(c.caseType);
    if (ct) typeCounts[ct] = (typeCounts[ct]||0)+1;
  });
  const types = Object.entries(typeCounts)
    .sort((a,b)=>b[1]-a[1])
    .map(([name, cnt]) => ({name, cnt}));

  // 前10名未結案件（依等待天數）
  const exportNow = new Date();
  const pendingTop = allCases
    .filter(c => c.status === '待處理' && !c.flagReason)
    .map(c => {
      const d = parseDate(c.datetime || c.date);
      const daysWait = d ? Math.floor((exportNow - d) / 86400000) : 0;
      return { c, daysWait };
    })
    .sort((a,b) => b.daysWait - a.daysWait)
    .slice(0, 10)
    .map((e,i) => ({
      rank: i+1,
      loc: effArea(e.c)+' · '+(e.c.normalizedLocation||e.c.location||''),
      days: e.daysWait,
      date: e.c.datetime||e.c.date||'',
      desc: e.c.description||''
    }));

  // 案件明細
  const detail = includeDetail ? cases.map(c => ({
    caseId: c.caseId, datetime: c.datetime, unit: c.unit, name: c.name,
    area: effArea(c), locationType: c.locationType, location: c.location||'',
    description: c.description, status: c.status, repairNote: c.repairNote||'',
    caseType: normalizeCaseType(c.caseType)||'', closerName: c.closerName||''
  })) : [];

  const stats = { rangeLabel, total, pending, done, rate, areas, types, pendingTop, detail };

  try {
    const data = await callApi({ action: 'generateExcelReport', stats });
    if (data.success) {
      const a = document.createElement('a');
      a.href = data.url;
      a.download = data.fileName || 'report.xlsx';
      a.target = '_blank';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      closeExportModal();
      showToast('✓ 報告已下載');
    } else {
      showToast('生成失敗：'+(data.message||'未知錯誤'));
    }
  } catch(e) {
    showToast('生成失敗：' + (e.message || '請檢查網路'));
  }

  btn.textContent = '下載 Excel'; btn.disabled = false;
}



// ── 照片上傳 ──
const photoData = { report: [null, null], };

function triggerPhotoUpload(prefix, idx) {
  const fileId = prefix.startsWith('close') ? `close-file-${prefix.slice(6)}-${idx}` : `report-file-${idx}`;
  document.getElementById(fileId).click();
}

async function handlePhotoUpload(prefix, idx, input) {
  const file = input.files[0];
  if (!file) return;
  let compressed;
  try {
    compressed = await compressImage(file, 600, 0.65);
  } catch(e) {
    showToast('照片檔案過大，請選擇較小的照片或詳述故障狀況即可');
    input.value = '';
    return;
  }
  const rowIndex = prefix.startsWith('close') ? prefix.slice(6) : null;
  const slotId = rowIndex ? `close-slot-${rowIndex}-${idx}` : `report-slot-${idx}`;
  const slot = document.getElementById(slotId);
  slot.innerHTML = `<img src="${compressed}"><div class="photo-del" onclick="event.stopPropagation();removePhoto('${prefix}',${idx})">×</div>`;

  if (!prefix.startsWith('close')) {
    if (!photoData.report) photoData.report = [null, null];
    photoData.report[idx] = compressed;
    // report-slot-1 預設已顯示
  } else {
    if (!photoData[prefix]) photoData[prefix] = [null, null];
    photoData[prefix][idx] = compressed;
    // close-slot 預設已顯示
  }
  input.value = '';
}

async function generateReport(rowIndex, btn) {
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = '生成中…';
  try {
    const data = await callApi({action:'generateReport', rowIndex});
    if (data.success) {
      const a = document.createElement('a');
      a.href = data.url;
      a.download = data.fileName || 'report.pptx';
      a.target = '_blank';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      showToast('✓ 報告已生成');
    } else {
      showToast('生成失敗：'+(data.message||'未知錯誤'));
    }
  } catch(e) { showToast('生成失敗：' + (e.message || '請檢查網路')); }
  btn.disabled = false;
  btn.textContent = originalText;
}

async function deleteReportPhoto(rowIndex, idx) {
  if (!confirm('確定要刪除這張報修照片嗎？此操作無法復原。')) return;
  try {
    const data = await callApi({action:'deletePhoto', rowIndex, photoType:'report', index:idx});
    if (data.success) {
      showToast('✓ 照片已刪除');
      await loadCases(true);
    } else {
      showToast('刪除失敗：'+(data.message||'未知錯誤'));
    }
  } catch(e) { showToast('刪除失敗：' + (e.message || '請檢查網路')); }
}

function removePhoto(prefix, idx) {
  const isClose = prefix.startsWith('close');
  const rowIndex = isClose ? prefix.slice(6) : null;
  const slotId = isClose ? `close-slot-${rowIndex}-${idx}` : `report-slot-${idx}`;
  const slot = document.getElementById(slotId);
  slot.innerHTML = '<span class="photo-add">+</span>';
  if (photoData[prefix]) photoData[prefix][idx] = null;
  if (idx === 0) {
    if (photoData[prefix]) photoData[prefix][1] = null;
    const slot1Id = isClose ? `close-slot-${rowIndex}-1` : 'report-slot-1';
    const slot1 = document.getElementById(slot1Id);
    if (slot1) { slot1.innerHTML = '<span class="photo-add">+</span>'; }
  }
}

function compressImage(file, maxSize, quality) {
  return new Promise((resolve, reject) => {
    // 原始檔案過大時直接提示，避免瀏覽器處理超大圖片卡死
    const MAX_RAW_MB = 15;
    if (file.size > MAX_RAW_MB * 1024 * 1024) {
      reject(new Error('FILE_TOO_LARGE'));
      return;
    }
    const reader = new FileReader();
    const timeout = setTimeout(() => reject(new Error('TIMEOUT')), 15000);
    reader.onerror = () => { clearTimeout(timeout); reject(new Error('READ_ERROR')); };
    reader.onload = e => {
      const img = new Image();
      img.onerror = () => { clearTimeout(timeout); reject(new Error('IMAGE_ERROR')); };
      img.onload = () => {
        clearTimeout(timeout);
        let w = img.width, h = img.height;
        if (w > maxSize || h > maxSize) {
          if (w > h) { h = Math.round(h * maxSize / w); w = maxSize; }
          else { w = Math.round(w * maxSize / h); h = maxSize; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function getClosePhotos(rowIndex) {
  const key = 'close-' + rowIndex;
  return photoData[key] ? photoData[key].filter(Boolean) : [];
}

function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}
