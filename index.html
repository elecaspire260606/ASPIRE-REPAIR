<html lang="zh-TW"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>設施報修系統 · 渴望會館</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192x192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="渴望報修">
<meta name="theme-color" content="#E8761A">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans TC', sans-serif; background: #FBF8F4; color: #1a1a1a; min-height: 100vh; }

  /* ── Navigation ── */
  .nav {
    background: #E8761A;
    padding: 0; display: flex; align-items: stretch;
    box-shadow: 0 2px 12px rgba(232,118,26,0.25);
    position: sticky; top: 0; z-index: 50;
  }
  .nav-brand { color: white; font-size: 15px; font-weight: 700; padding: 14px 18px; letter-spacing: 0.03em; display: flex; align-items: center; gap: 7px; }
  .nav-tabs { display: flex; margin-left: auto; }
  .nav-tab { color: rgba(255,255,255,0.75); font-size: 13px; padding: 0 14px; display: flex; align-items: center; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.15s; font-weight: 500; }
  .nav-tab:hover { color: white; background: rgba(255,255,255,0.12); }
  .nav-tab.active { color: white; border-bottom-color: white; }
  .logout-btn { font-size: 12px; color: rgba(255,255,255,0.65); cursor: pointer; padding: 0 14px; display: flex; align-items: center; border-left: 1px solid rgba(255,255,255,0.2); }
  .logout-btn:hover { color: white; }

  /* ── Stats bar ── */
  .stats-bar { background: #FFFFFF; border-bottom: 1px solid #f2ede8; padding: 9px 14px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; position: sticky; top: 41px; z-index: 49; box-shadow: 0 1px 4px rgba(0,0,0,0.03); }
  .stats-item { display: flex; align-items: baseline; gap: 5px; font-size: 12px; color: #999; }
  .stats-item b { font-size: 15px; color: #E8761A; font-weight: 700; }
  .stats-item span.val { font-size: 13px; color: #1a1a1a; font-weight: 600; }
  .stats-refresh { margin-left: auto; width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid #f0ece6; background: white; color: #E8761A; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; flex-shrink: 0; }
  .stats-refresh:hover { background: #FEF0E3; border-color: #E8761A; }
  .stats-refresh.spinning { animation: spin 0.7s linear; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  /* ── Pages ── */
  .page { display: none; padding: 20px 16px; max-width: 700px; margin: 0 auto; }
  .page.active { display: block; }

  /* ── Cards ── */
  .card { background: white; border-radius: 16px; box-shadow: 0 2px 16px rgba(0,0,0,0.07); overflow: hidden; margin-bottom: 16px; }
  .card-header { background: #E8761A; color: white; padding: 13px 18px; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .card-body { padding: 18px; }
  .section-label { font-size: 11px; font-weight: 700; color: #E8761A; text-transform: uppercase; letter-spacing: 0.08em; margin: 0 0 13px; }
  .field { margin-bottom: 15px; }
  .field label { font-size: 12px; color: #666; display: block; margin-bottom: 5px; font-weight: 500; }
  .field input, .field select, .field textarea { width: 100%; padding: 10px 13px; border: 1.5px solid #e8e8e8; border-radius: 10px; font-size: 14px; color: #1a1a1a; background: white; outline: none; transition: border 0.15s; font-family: inherit; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: #E8761A; }
  .field input[readonly] { background: #f8f6f3; color: #777; cursor: default; }
  .field textarea { resize: vertical; min-height: 82px; }
  .field .hint { font-size: 11px; color: #bbb; margin-top: 4px; }
  .divider { height: 1px; background: #f2ede8; margin: 16px 0; }

  /* ── Location type buttons ── */
  .loc-type-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .loc-type-btn { flex: 1; min-width: 70px; padding: 9px 6px; border: 1.5px solid #e8e8e8; border-radius: 10px; background: white; font-size: 13px; cursor: pointer; color: #666; transition: all 0.15s; text-align: center; font-family: inherit; font-weight: 500; }
  .loc-type-btn.unit-electrical { background:#EAF2FB; border-color:#3B7DD8; color:#2C5AA0; } /* 機電補單標示成藍色，跟其他單位按鈕區隔開，方便快速點選 */
  .loc-type-btn.active { background: #E8761A; color: white; border-color: #E8761A; }
  .loc-type-btn:hover:not(.active) { border-color: #E8761A; color: #E8761A; }

  /* ── Buttons ── */
  .btn-primary { width: 100%; padding: 13px; background: #E8761A; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.15s; font-family: inherit; box-shadow: 0 4px 12px rgba(232,118,26,0.3); }
  .btn-primary:hover { background: #d06815; }
  .btn-primary:active { transform: scale(0.99); }
  .btn-primary:disabled { background: #ccc; box-shadow: none; cursor: not-allowed; }

  /* ── Lock ── */
  .lock-overlay { display:flex; align-items:center; justify-content:center; min-height:260px; }
  .lock-box { background:white; border-radius:18px; box-shadow:0 4px 24px rgba(0,0,0,0.1); padding:32px 28px; width:100%; max-width:320px; text-align:center; }
  .lock-icon { font-size:36px; margin-bottom:12px; }
  .lock-title { font-size:16px; font-weight:700; color:#1a1a1a; margin-bottom:6px; }
  .lock-sub { font-size:12px; color:#bbb; margin-bottom:18px; }
  .lock-input { width:100%; padding:11px 14px; border:1.5px solid #e8e8e8; border-radius:10px; font-size:18px; text-align:center; letter-spacing:0.2em; outline:none; color:#1a1a1a; font-family:inherit; }
  .lock-input:focus { border-color:#E8761A; }
  .lock-btn { width:100%; margin-top:12px; padding:12px; background:#E8761A; color:white; border:none; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; box-shadow:0 4px 12px rgba(232,118,26,0.3); }
  .lock-btn:hover { background:#d06815; }
  .lock-err { font-size:12px; color:#e05252; margin-top:8px; min-height:18px; }

  /* ── Toast ── */
  .toast { position:fixed; bottom:28px; left:50%; transform:translateX(-50%); background:#1a1a1a; color:white; padding:11px 22px; border-radius:10px; font-size:13px; opacity:0; pointer-events:none; transition:opacity 0.3s; z-index:200; white-space:nowrap; box-shadow:0 4px 16px rgba(0,0,0,0.2); }
  .toast.show { opacity:1; }

  /* ── Filters ── */
  .filter-row { display:flex; gap:8px; margin-bottom:12px; }
  .filter-btn { flex:1; padding:9px 4px; border:1.5px solid #e8e8e8; border-radius:10px; background:white; font-size:13px; cursor:pointer; color:#666; transition:all 0.15s; font-family:inherit; font-weight:500; }
  .filter-btn.active { background:#E8761A; color:white; border-color:#E8761A; }
  .filter-btn:hover:not(.active) { border-color:#E8761A; color:#E8761A; }
  .dash-select { font-size:12px; padding:6px 10px; border:1.5px solid #e8e8e8; border-radius:8px; color:#444; background:white; outline:none; font-family:inherit; }
  .dash-select:focus { border-color:#E8761A; }

  /* ── Pagination ── */
  .pagination { display:flex; justify-content:center; align-items:center; gap:5px; margin-top:14px; flex-wrap:wrap; }
  .page-btn { padding:7px 12px; border:1.5px solid #e8e8e8; border-radius:8px; background:white; font-size:13px; cursor:pointer; color:#666; transition:all 0.15s; font-family:inherit; }
  .page-btn.active { background:#E8761A; color:white; border-color:#E8761A; }
  .page-btn:hover:not(.active):not(:disabled) { border-color:#E8761A; color:#E8761A; }
  .page-btn:disabled { opacity:0.35; cursor:not-allowed; }
  .page-ellipsis { font-size:13px; color:#bbb; padding:0 4px; }

  /* ── Case cards ── */
  .case-card { background:white; border-radius:12px; box-shadow:0 2px 12px rgba(0,0,0,0.06); padding:11px 13px; margin-bottom:8px; position:relative; }
  .case-row-top { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .case-row-title { font-size:14px; font-weight:600; color:#1a1a1a; line-height:1.3; }
  .case-row-meta { font-size:11px; color:#aaa; margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .case-row-meta .photo-tag { color:#C05E0A; font-weight:600; }
  .case-row-desc { font-size:12.5px; color:#555; margin-top:5px; line-height:1.4; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .case-row-note { font-size:11.5px; color:#1E7A3E; margin-top:5px; background:#E6F4EA; border-radius:6px; padding:5px 9px; line-height:1.4; }
  .case-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:12px; align-items:start; }
  .case-grid .case-card { margin-bottom:0; }
  @media (max-width:700px) { .case-grid { grid-template-columns:1fr; } }
  .case-card.area-館 { background:#FDEBD0; }
  .case-card.area-雅 { background:#DDE9F7; }
  .case-card.area-研 { background:#D5EDD9; }
  .case-card.area-智 { background:#E8E3F0; }
  .case-card.area-其 { background:#EBEBEB; }
  #caseList { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  #caseList .case-card { margin-bottom:0; }
  #caseList .case-card.expanded-card { grid-column: 1 / -1; }
  @media (max-width:700px) { #caseList { grid-template-columns:1fr; } }
  /* 已結案不再用背景色蓋掉區域色：區域色應該不管待處理/已結案都要看得到，
     結案狀態已經有右上角「已結案」標籤和綠色勾勾筆記可以辨識，不需要背景色重複表達，
     也避免跟.area-*規則搶優先權(同樣是兩個class疊加，寫在後面的會贏，導致區域色被蓋掉) */
  .case-card.is-flagged { background:#f5f5f5; opacity:0.72; }
  .case-card.is-flagged .case-title,
  .case-card.is-flagged .case-desc { text-decoration:line-through; color:#bbb; }
  .flag-stamp {
    position:absolute; top:16px; right:16px;
    border:3px solid #C0392B; border-radius:6px;
    color:#C0392B; font-size:15px; font-weight:900;
    padding:4px 10px; letter-spacing:3px;
    transform:rotate(-12deg); transform-origin:center;
    opacity:0.75; pointer-events:none; white-space:nowrap;
    font-family:inherit; line-height:1.4;
  }
  .case-collapsed { cursor:pointer; border-radius:10px; transition:background 0.15s; margin:-4px; padding:4px; }
  .case-collapsed:hover { background:#faf8f5; }
  .case-tap-hint { font-size:11px; color:#ccc; text-align:center; margin-top:10px; padding-top:8px; border-top:1px dashed #f0ece6; }

  /* ── 案件詳情 Side Panel ── */
  #caseDetailPanel {
    position:fixed; top:0; right:0; bottom:0; width:390px;
    background:white; box-shadow:-4px 0 24px rgba(0,0,0,0.15);
    z-index:400; transform:translateX(100%);
    transition:transform 0.28s cubic-bezier(0.4,0,0.2,1);
    display:flex; flex-direction:column; overflow:hidden;
  }
  #caseDetailPanel.open { transform:translateX(0); }
  .panel-header {
    background:var(--navy,#1A3A5C); color:white;
    padding:16px 18px; display:flex; justify-content:space-between; align-items:center;
    flex-shrink:0;
  }
  .panel-body { flex:1; overflow-y:auto; padding:16px; }
  .panel-section { margin-bottom:14px; }
  .panel-label { font-size:11px; color:#bbb; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:4px; }
  .panel-value { font-size:14px; color:#333; }
  .panel-divider { border:none; border-top:1px solid #f0ece6; margin:12px 0; }
  .drill-row-clickable { cursor:pointer; transition:background 0.15s; }
  .drill-row-clickable:hover { background:#faf0e8; }
  @media (max-width:600px) {
    #caseDetailPanel { width:100%; top:auto; height:80vh; border-radius:18px 18px 0 0;
      transform:translateY(100%); box-shadow:0 -4px 24px rgba(0,0,0,0.15); }
    #caseDetailPanel.open { transform:translateY(0); }
  }
  .case-expand-header { display:flex; justify-content:space-between; align-items:flex-start; cursor:pointer; margin-bottom:10px; padding-bottom:10px; border-bottom:1px solid #f2ede8; transition:opacity 0.15s; }
  .case-expand-header:hover { opacity:0.6; }
  .collapse-hint { font-size:11px; color:#bbb; white-space:nowrap; padding-top:2px; }
  .case-top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px; }
  .case-id { font-size:11px; color:#bbb; font-weight:500; }
  .case-title { font-size:15px; font-weight:600; color:#1a1a1a; margin:3px 0 4px; }
  .case-meta { font-size:12px; color:#aaa; margin-bottom:9px; }
  .case-desc { font-size:13px; color:#555; background:#faf8f5; border-radius:8px; padding:9px 11px; margin-bottom:11px; border-left:3px solid #E8761A; }
  .badge { font-size:11px; padding:4px 11px; border-radius:20px; font-weight:600; white-space:nowrap; }
  .ppt-btn { font-size:11px; padding:5px 10px; border-radius:8px; font-weight:600; white-space:nowrap; background:#4A90D9; color:white; border:none; cursor:pointer; font-family:inherit; }
  .ppt-btn:disabled { opacity:0.6; cursor:default; }
  .badge.pending { background:#FEF0E3; color:#C05E0A; }
  .badge.done { background:#E6F4EA; color:#2D7A3E; }
  .badge.flagged { background:#f0f0f0; color:#999; }

  /* ── 今日優先：只在真的有當日營運需求時使用，不做高中低多層級 ── */
  .priority-choice { border:1.5px solid #ece7e1; border-radius:12px; padding:12px; background:#fffdfa; }
  .priority-toggle { width:100%; border:1.5px solid #f0c996; background:#fff7ec; color:#a95500; border-radius:10px; padding:10px 12px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; text-align:left; }
  .priority-toggle.active { background:#FDE8C8; border-color:#E8761A; box-shadow:0 0 0 2px rgba(232,118,26,.08); }
  .priority-reason-row { display:flex; gap:6px; flex-wrap:wrap; margin-top:9px; }
  .priority-reason-btn { border:1px solid #eadfd2; background:white; color:#666; border-radius:18px; padding:6px 10px; font-size:12px; cursor:pointer; font-family:inherit; }
  .priority-reason-btn.active { background:#E8761A; border-color:#E8761A; color:white; }
  .priority-strip { display:flex; align-items:center; gap:6px; background:#fff2dd; border:1px solid #f3c47c; color:#a65300; border-radius:7px; padding:5px 8px; margin-bottom:7px; font-size:11px; font-weight:800; }
  .priority-strip.overdue { background:#fff0e9; border-color:#ef9c78; color:#b13d18; }
  .priority-filter-btn { border:1.5px solid #f0c996; background:#fffaf3; color:#a95500; border-radius:18px; padding:7px 12px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; }
  .priority-filter-btn.active { background:#E8761A; border-color:#E8761A; color:white; }

  /* ── Mgr fields ── */
  .mgr-field { margin-bottom:10px; }
  .mgr-advanced-toggle { font-size:12px; color:#1a3a5c; font-weight:600; text-align:center; padding:10px 0 4px; cursor:pointer; border-top:1px dashed #e8e8e8; margin-top:6px; }
  .mgr-advanced-fields { margin-top:8px; }
  .mgr-label { font-size:11px; color:#aaa; display:flex; align-items:center; gap:5px; margin-bottom:5px; font-weight:500; }
  .opt-tag { font-size:10px; color:#bbb; background:#f2f2f2; padding:1px 6px; border-radius:4px; }
  .tooltip-wrap { position:relative; display:inline-flex; }
  .tooltip-icon { font-size:12px; color:#ccc; cursor:default; }
  .tooltip-wrap:hover .tooltip-box { display:block; }
  .tooltip-box { display:none; position:absolute; bottom:calc(100% + 6px); left:50%; transform:translateX(-50%); background:#333; color:white; font-size:11px; padding:5px 9px; border-radius:6px; white-space:nowrap; z-index:10; pointer-events:none; }
  .mgr-field textarea, .mgr-field input[type=text] { width:100%; padding:8px 11px; border:1.5px solid #e8e8e8; border-radius:9px; font-size:13px; outline:none; font-family:inherit; color:#1a1a1a; background:white; }
  .mgr-field textarea { min-height:62px; resize:vertical; }
  .mgr-field textarea:focus, .mgr-field input[type=text]:focus { border-color:#E8761A; }

  /* ── Flag buttons ── */
  .flag-row { display:flex; gap:6px; flex-wrap:wrap; }
  .flag-btn { padding:5px 12px; border:1.5px solid #ccc; border-radius:20px; background:white; font-size:12px; cursor:pointer; color:#555; transition:all 0.15s; font-family:inherit; font-weight:500; }
  .flag-btn.active-flag { background:#E8761A; color:white; border-color:#E8761A; font-weight:600; }
  .flag-btn:hover:not(.active-flag) { border-color:#E8761A; color:#E8761A; }

  .btn-row { display:flex; gap:8px; margin-top:10px; }
  .btn-save { flex:1; padding:9px; background:#E8761A; color:white; border:none; border-radius:9px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; }
  .btn-save:hover { background:#d06815; }
  .btn-close-case { flex:1; padding:9px; background:#2D7A3E; color:white; border:none; border-radius:9px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; }
  .btn-close-case:hover { background:#246332; }
  .btn-reopen { flex:1; padding:9px; background:#f0f0f0; color:#666; border:none; border-radius:9px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; }
  .btn-reopen:hover { background:#e5e5e5; }

  /* ── Dashboard ── */
  .stats-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:14px; }
  .stat-card { background:white; border-radius:14px; box-shadow:0 2px 12px rgba(0,0,0,0.06); padding:16px; text-align:center; position:relative; overflow:hidden; border-left:4px solid transparent; }
  .stat-card.tint-navy { background:linear-gradient(135deg,#fbfcfe 0%,#eef3f8 100%); border-left-color:#1a3a5c; }
  .stat-card.tint-red { background:linear-gradient(135deg,#fffbfa 0%,#fdecea 100%); border-left-color:#E0524D; }
  .stat-card.tint-green { background:linear-gradient(135deg,#fafdfb 0%,#e9f5ed 100%); border-left-color:#2D7A3E; }
  .stat-num { font-size:28px; font-weight:700; }
  .stat-num.orange { color:#E8761A; }
  .stat-num.green { color:#2D7A3E; }
  .stat-num.navy { color:#1a3a5c; }
  .stat-num.gray { color:#aaa; }
  .stat-num.red { color:#E0524D; }
  .stat-card.rate-card {
    background: linear-gradient(135deg, #E8761A 0%, #F4A24A 100%);
    box-shadow: 0 6px 20px rgba(232,118,26,0.35);
    border-left: none;
    transform: scale(1.03);
  }
  .stat-card.rate-card::before {
    content: '';
    position: absolute;
    top: -30px; right: -30px;
    width: 100px; height: 100px;
    background: rgba(255,255,255,0.15);
    border-radius: 50%;
  }
  .stat-card.rate-card::after {
    content: '';
    position: absolute;
    bottom: -25px; left: -25px;
    width: 70px; height: 70px;
    background: rgba(255,255,255,0.1);
    border-radius: 50%;
  }
  .stat-card.rate-card .stat-num { color: white; position: relative; z-index: 1; font-size: 34px; }
  .stat-card.rate-card .stat-label { color: rgba(255,255,255,0.9); position: relative; z-index: 1; font-weight:600; }
  .stat-label { font-size:12px; color:#bbb; margin-top:4px; font-weight:500; }
  .chart-wrap { background:white; border-radius:14px; box-shadow:0 2px 12px rgba(0,0,0,0.06); padding:18px; margin-bottom:14px; }
  .chart-title { font-size:13px; font-weight:700; margin-bottom:14px; color:#1a1a1a; }
  .bar-row { display:flex; align-items:center; gap:10px; margin-bottom:10px; font-size:12px; }
  .bar-label { width:54px; color:#666; text-align:right; flex-shrink:0; }
  .bar-track { flex:1; background:#f2ede8; border-radius:5px; height:16px; overflow:hidden; }
  .bar-fill { height:100%; border-radius:5px; transition:width 0.5s ease; min-width:4px; }
  .bar-val { width:28px; color:#444; font-weight:600; }

  /* ── Time filter ── */
  .time-filter-row { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  .time-btn { padding:7px 13px; border:1.5px solid #e8e8e8; border-radius:20px; background:white; font-size:12px; cursor:pointer; color:#666; transition:all 0.15s; font-family:inherit; font-weight:500; }
  .time-btn.active { background:#E8761A; color:white; border-color:#E8761A; }
  .time-btn:hover:not(.active) { border-color:#E8761A; color:#E8761A; }

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyDHXpaV6JUrlLynauBCtYrgIw4kYKwDxpuPdSJmZ_7xpzPLczsijgIc2LE_3koJbMj/exec';

// 統一的fetch包裝：加上逾時控制(AbortController)，避免請求無限期卡在「等待中」
// timeoutMs逾時後會主動中止請求，AbortError轉換成容易理解的訊息，不同動作可以給不同的合理逾時秒數
async function fetchWithTimeout(url, options = {}, timeoutMs = 15000) {
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const response = await fetch(url, { ...options, signal: controller.signal });
    return response;
  } catch (e) {
    if (e.name === 'AbortError') {
      throw new Error('請求逾時，請稍後再試');
    }
    throw e;
  } finally {
    clearTimeout(timeoutId);
  }
}

// 共用：把fetch回來的Response轉成JSON物件，統一檢查HTTP狀態/空內容/JSON解析失敗，
// 讓getManagerCases/searchCasesByName/getGmCases這幾個唯讀查詢也有跟callApiOnce一樣完整的錯誤檢查，
// 不然Apps Script偶爾回傳HTML錯誤頁時，只會看到一個模糊的JSON解析錯誤，不容易判斷到底是哪裡出問題
async function parseGetResponse_(response) {
  // 一律先讀文字，避免 Google 回 HTML 錯誤頁時又被 response.json() 產生第二層 JSON 解析錯誤
  const text = await response.text();
  if (!response.ok) {
    console.error('查詢API HTTP錯誤:', response.status, text.slice(0, 300));
    const err = new Error(response.status === 404
      ? 'API部署端點不存在或尚未更新，請重新部署 Apps Script'
      : '系統暫時無法連線，請稍後再試');
    err.status = response.status;
    // 404/權限類錯誤不是暫時性網路抖動，重試只會製造更多請求
    err.noRetry = [400, 401, 403, 404].includes(response.status);
    throw err;
  }
  if (!text) {
    console.error('查詢API回傳空內容');
    throw new Error('系統暫時忙碌，請稍後再試');
  }
  try {
    return JSON.parse(text);
  } catch (e) {
    console.error('查詢API JSON解析失敗:', text.slice(0, 500));
    const err = new Error('API回傳格式異常，請重新部署 Apps Script');
    err.noRetry = true;
    throw err;
  }
}

// 唯讀 API 統一走 POST。
// 系統原本登入/更新/結案的 POST 通道已長期使用；把讀取也統一走同一路徑，
// 可避開 Apps Script GET + redirect + Service Worker/瀏覽器快取組合下偶發的 404。
async function callReadApi_(params, timeoutMs = 15000) {
  const response = await fetchWithTimeout(API_URL, {
    method: 'POST',
    body: JSON.stringify(params),
    cache: 'no-store',
    redirect: 'follow'
  }, timeoutMs);
  return await parseGetResponse_(response);
}
// 密碼驗證已移至後端
const PAGE_SIZE = 20;
const MGR_PAGE_SIZE = 10; // 修繕管理頁預設顯示筆數調降，減少單次要處理/渲染的案件量(查詢頁、GM模式維持20不變)

let allCases = [];
let lastCasesServerVersion = null; // 後端極簡案件版本；相同時只回 changed:false，不傳案件陣列
// 本機案件快取：只是「先給使用者看」的暫存，正式資料一律以Google Sheets/Apps Script為準。
// 用途是進頁的當下先顯示上次看到的案件，不用整頁空等後端回應，背景再去跟後端同步最新資料。
// 一般案件(修繕管理/姓名查詢/GM模式，只有主表近期資料)跟統計頁(主表+封存表全量資料)用不同的key，不能共用，
// 不然修繕管理可能會不小心吃到統計頁抓回來、含封存舊案件的那份資料。
const CASES_CACHE_KEY = 'aspire_cases_cache_v2';
const DASHBOARD_CACHE_KEY = 'aspire_dashboard_cache_v1'; // 完整歷史案件的低頻快取：GM全量與列印/匯出共用，但不混入一般 CASES_CACHE_KEY
const DASHBOARD_SNAPSHOT_CACHE_KEY = 'aspire_dashboard_area_cube_v4'; // 給統計頁loadDashboardSnapshot()的統計數字快取，形狀不同，不能共用同一個key
function loadCacheByKey_(key) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || !Array.isArray(parsed.cases)) return null;
    return parsed; // { version, savedAt, cases }
  } catch(e) {
    // JSON壞掉或localStorage不可用，安靜清掉損壞的快取，不讓頁面報錯
    try { localStorage.removeItem(key); } catch(e2) {}
    return null;
  }
}
function saveCacheByKey_(key, cases, serverVersion, loadedRange) {
  try {
    localStorage.setItem(key, JSON.stringify({ version: 2, savedAt: Date.now(), cases, serverVersion:serverVersion||'', loadedRange:loadedRange??null }));
  } catch(e) {}
}
function clearCacheByKey_(key) {
  try { localStorage.removeItem(key); } catch(e) {}
}
function loadCasesCache() { return loadCacheByKey_(CASES_CACHE_KEY); }
function saveCasesCache(cases) { return saveCacheByKey_(CASES_CACHE_KEY, cases, lastCasesServerVersion, lastLoadedDays); }
function clearCasesCache() { return clearCacheByKey_(CASES_CACHE_KEY); }

// 統計頁快照快取(形狀跟一般案件快取不一樣，存的是算好的統計數字，不是案件陣列，所以另外寫一對函式、也用獨立的key)

function dashboardParamsKey_(params) {
  if (!params) return '';
  // Area Cube 一次已包含全部棟別，因此快取 key 只跟時間條件有關，不再把 area 拆成六份。
  return JSON.stringify([params.year||'', params.month||'all', params.dateFrom||'', params.dateTo||'']);
}

function loadSnapshotCache(params) {
  try {
    const raw=localStorage.getItem(DASHBOARD_SNAPSHOT_CACHE_KEY);
    if(!raw)return null;
    const parsed=JSON.parse(raw);
    if(!parsed||!parsed.cube||!parsed.cube.areas)return null;
    if(params&&parsed.paramsKey!==dashboardParamsKey_(params))return null;
    return parsed;
  } catch(e) {
    try{localStorage.removeItem(DASHBOARD_SNAPSHOT_CACHE_KEY);}catch(e2){}
    return null;

// ── 位置標準化 ──
function normalizeLocation(raw) {
  if (!raw) return '';
  raw = String(raw);
  if (!raw.trim()) return '';
  let s = raw.trim();
  s = s.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0)-0xFEE0));
  const cnMap = {'零':0,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
  s = s.replace(/[一二三四五六七八九零十百]+/g, m => {
    let n = 0;
    if (m.includes('十')) {
      const parts = m.split('十');
      const left = parts[0] ? parts[0].split('').reduce((a,c)=>a*10+(cnMap[c]??0),0) : 1;
      const right = parts[1] ? parts[1].split('').reduce((a,c)=>a*10+(cnMap[c]??0),0) : 0;
      n = left*10 + right;
    } else {
      n = m.split('').reduce((a,c)=>a*10+(cnMap[c]??0),0);
    }
    return n>0 ? String(n) : m;
  });
  s = s.replace(/(\d+)\s*[樓层F]/g, '$1F');
  s = s.replace(/走道|廊道|通道/g, '走廊');
  s = s.replace(/厅/g, '廳');
  s = s.replace(/(\d+)\s*[號号]\s*[房室間]?/g, '$1');
  s = s.replace(/(\d+)\s*[室房間]/g, '$1');
  s = s.replace(/[、，,。.]\s*$/, '');
  s = s.replace(/\s+/g, ' ').trim();
  return s;
}

function showNormPreview() {
  const raw = document.getElementById('f-location').value;
  const norm = normalizeLocation(raw);
  const preview = document.getElementById('normPreview');
  if (norm && norm !== raw.trim()) {
    document.getElementById('normValue').textContent = norm;
    preview.style.display = 'block';
  } else { preview.style.display = 'none'; }
}

// ── 登入狀態管理(改用localStorage,關閉分頁/瀏覽器/重開PWA後不用重新輸入密碼) ──
// 登入token有效期1個月(後端PropertiesService存的到期時間戳)，過期前都不用重新登入。
function getStoredAuthToken() {
  const token = localStorage.getItem('adminToken');
  const expiresAt = Number(localStorage.getItem('adminTokenExpiresAt') || 0);
  if (!token || !expiresAt || Date.now() >= expiresAt) {
    clearStoredAuth();
    return '';
  }
  return token;
}

function clearStoredAuth() {
  localStorage.removeItem('adminToken');
  localStorage.removeItem('adminTokenExpiresAt');
  localStorage.removeItem('adminRole');
  // 舊版本是存在sessionStorage、而且token其實就是原始密碼，不能信任，一併清掉強制走一次新版登入
  sessionStorage.removeItem('adminToken');
}

async function checkPassword() {
  if (checkPasswordInFlight) return; // 已經有一個驗證正在跑，忽略這次重複觸發(不管是Enter還是按鈕)
  const pw = document.getElementById('pwInput').value;
  if (!pw) return;
  checkPasswordInFlight = true;
  const btn = document.querySelector('#page-lock button');
  if (btn) { btn.textContent='驗證中…'; btn.disabled=true; }

  const attemptAuth = async () => {
    const r = await fetchWithTimeout(API_URL, {
      method:'POST',
      body: JSON.stringify({ action:'auth', password:pw })
    }, 25000); // 原本設12秒，考量Apps Script偶爾需要排隊/較慢反應(曾實測其他動作到8-10秒)，放寬避免誤判
    const text = await r.text();
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    if (!text) throw new Error('回應內容為空');
    return JSON.parse(text);
  };

  try {
    let data;
    try {
      data = await attemptAuth();
    } catch (e) {
      // 登入驗證沒有重複風險(不會造成資料重複)，失敗時可以安全地安靜重試一次
      console.warn('checkPassword 第一次失敗，1.5秒後自動重試一次:', e.message);
      await new Promise(r => setTimeout(r, 1500));
      data = await attemptAuth();
    }
    if (btn) { btn.textContent='確認'; btn.disabled=false; }
    if (data.success) {
      localStorage.setItem('adminToken', data.token);
      localStorage.setItem('adminTokenExpiresAt', String(data.expiresAt || (Date.now() + 30*24*60*60*1000)));
      localStorage.setItem('adminRole', data.role || 'admin');
      document.getElementById('page-lock').style.display='none';
      document.getElementById('logoutBtn').style.display='flex';
      switchPage(pendingPage||'mgr'); pendingPage=null;
    } else {
      document.getElementById('pwErr').textContent='密碼錯誤，請再試一次';
      document.getElementById('pwInput').value='';
      document.getElementById('pwInput').focus();
    }
  } catch(e) {
    if (btn) { btn.textContent='確認'; btn.disabled=false; }
    console.error('checkPassword 失敗:', e);
    document.getElementById('pwErr').textContent='系統暫時無法連線，請稍後再試';
  } finally {
    checkPasswordInFlight = false; // 不管成功或失敗，一定要釋放鎖，不然使用者會永遠點不動
  }
}

        console.error('submitForm 網路層錯誤:', e);
        throw new Error('網路目前不穩定，案件尚未送出，請再試一次');
      }
      const text = await response.text();
      if (!response.ok) {
        console.error('submitForm HTTP錯誤:', response.status, text);
        throw new Error('系統暫時無法連線，剛才填寫的內容仍保留，請稍後再試');
      }
      if (!text) {
        console.error('submitForm 回傳空內容');
        throw new Error('系統暫時忙碌，剛才填寫的內容仍保留，請稍後再試');
      }
      try {
        return JSON.parse(text);
      } catch (e) {
        console.error('submitForm JSON解析失敗:', text);
        throw new Error('系統暫時忙碌，剛才填寫的內容仍保留，請稍後再試');
      }
    };

    // 送出報修會新增一筆案件，如果自動重試、第一次其實已經成功，會造成重複報修，
    // 所以這裡不做自動重試，失敗就讓使用者自己看訊息決定要不要再送一次(填寫內容仍保留)。
    const data = await attemptSubmit();
    if (data.success) {
      showToast('✓ '+data.message);
      // 新案件已在伺服器建立，但目前 allCases 尚未包含它；讓下次進管理/查詢頁立刻做 version sync，不等30秒節流。
      lastCasesLoadTime = 0;
      dashboardSnapshot = null;
      dashboardCube = null;
      dashboardVersions = null;
      dashboardDatasetKey = '';
      locationStatsMemoryCache.clear();
      lastDashboardLoadTime = 0;
      fullHistoryCasesCache_ = null;
      fullHistoryCasesLoadedAt_ = 0;
      try { localStorage.removeItem(DASHBOARD_SNAPSHOT_CACHE_KEY); } catch(e) {}
      ['f-unit','f-name','f-area','f-location','f-desc','f-email'].forEach(id=>document.getElementById(id).value='');
      resetPriorityForm_();
      photoData.report = [null, null];
      document.getElementById('report-slot-0').innerHTML = '<span class="photo-add">+</span>';
      document.getElementById('report-slot-1').innerHTML = '<span class="photo-add">+</span>';
      document.getElementById('loc-input-wrap').style.display='none';
      document.getElementById('normPreview').style.display='none';
      document.querySelectorAll('#unit-btn-row .loc-type-btn').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('#area-btn-row .loc-type-btn').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('#loctype-btn-row .loc-type-btn').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('#restaurant-quick-row .loc-type-btn').forEach(b=>b.classList.remove('active'));
      document.getElementById('restaurant-quick-row').style.display='none';
      document.querySelectorAll('#facility-quick-row .loc-type-btn').forEach(b=>b.classList.remove('active'));
      document.getElementById('facility-quick-row').style.display='none';
      document.getElementById('yashe-building-row').style.display='none';
      document.querySelectorAll('#yashe-building-row .loc-type-btn').forEach(b=>b.classList.remove('active'));
      selectedBuilding = '';
      document.getElementById('btn-room').textContent='🚪 客房';
      document.getElementById('f-unit').style.display='none';
      locType='';
    } else { showToast('錯誤：'+data.message); }
  } catch(e) { showToast('❌ ' + (e.message || '連線失敗，請檢查網路')); }
  btn.disabled=false; btn.textContent='送出報修申請';
}

// ── 載入案件 ──
let loadCasesRequestSeq = 0; // 請求序號:避免比較舊、比較慢的請求(不管成功或失敗)蓋掉後來更新的畫面結果

async function loadCases(force, closedLimitOverride) {
  const targetClosedLimit = closedLimitOverride || casesClosedLimit;
  const targetPendingLimit = targetClosedLimit === 'all' ? 'all' : casesPendingLimit;
  const isAllMode = targetClosedLimit === 'all';

  if (!allCases.length) {
    const cached = isAllMode ? loadDashboardCache() : loadCasesCache();
    if (cached && cached.cases.length) {
      allCases = cached.cases;
      if (!isAllMode && cached.serverVersion) lastCasesServerVersion = cached.serverVersion;
      // 有 serverVersion + loadedRange 時可直接用極小 version request 驗證快取；版本不同才回完整案件。
      lastLoadedDays = (!isAllMode && cached.serverVersion && cached.loadedRange !== null && cached.loadedRange !== undefined)
        ? cached.loadedRange : null;
      const savedAgo = Math.round((Date.now() - cached.savedAt) / 60000);
      renderSyncStatus(savedAgo < 1 ? '顯示上次資料，正在同步最新案件…' : `顯示${savedAgo}分鐘前的資料，正在同步最新案件…`);
      renderCurrentPage();
    }
  }

  const alreadyHaveEnough = isAllMode
    ? lastLoadedDays === 'all'
    : (lastLoadedDays !== null && lastLoadedDays !== 'all' && lastLoadedDays >= targetClosedLimit);
  if (!force && alreadyHaveEnough && Date.now() - lastCasesLoadTime < CASES_AUTO_REFRESH_INTERVAL && allCases.length) {
    renderCurrentPage();
    return;
  }

  const mySeq = ++loadCasesRequestSeq;
  const timeoutMs = isAllMode ? 45000 : 25000;
  const readParams = { action:'getAll', closedLimit:targetClosedLimit, pendingLimit:targetPendingLimit };
  // 只有『手上的資料範圍已足夠』時才送 version；載入更早/force/冷快取仍拿完整資料，避免版本相同卻範圍不足。
  if (!isAllMode && !force && alreadyHaveEnough && lastCasesServerVersion) readParams.clientVersion = lastCasesServerVersion;
  const attemptLoad = () => callReadApi_(readParams, timeoutMs);

  try {
    let data;
    try {
      data = await attemptLoad();
    } catch (e) {
      if (e && e.noRetry) throw e;
      console.warn('loadCases 第一次失敗，1.5秒後自動重試一次:', e.message);
      await new Promise(r => setTimeout(r, 1500));
      data = await attemptLoad();
    }
    if (mySeq !== loadCasesRequestSeq) return;
    if (!data.success) throw new Error(data.message || '案件載入失敗');

    if (data.changed === false) {
      lastCasesServerVersion = data.version || lastCasesServerVersion;
      lastCasesLoadTime = Date.now();
      saveCasesCache(allCases);
      renderSyncStatus('✓ 已是最新資料', {autoClear:true});
      return;
    }

    // 走到完整回應代表版本不同、force 或載入範圍擴大；不再整包 JSON.stringify 比對一次，直接替換並重畫即可。
    allCases = data.cases || [];
    lastCasesServerVersion = data.version || lastCasesServerVersion;
    casesHasMore = !!data.hasMore;
    lastLoadedDays = targetClosedLimit;
    lastCasesLoadTime = Date.now();
    if (isAllMode) {
      saveDashboardCache(allCases);
      fullHistoryCasesCache_ = allCases;
      fullHistoryCasesLoadedAt_ = Date.now();
    } else saveCasesCache(allCases);
    renderCurrentPage();
    renderSyncStatus('✓ 案件已更新', {autoClear:true});
  } catch(e) {
    if (mySeq !== loadCasesRequestSeq) return;
    console.error('loadCases 失敗:', e);
    if (allCases.length) renderSyncStatus('⚠ 同步失敗，目前顯示上次資料', {warn:true});
    else if (currentPageId === 'dash') showToast('❌ 統計資料載入失敗，請點右上角重新整理再試一次');
    else document.getElementById('caseList').innerHTML='<div class="empty-state">載入失敗，請稍後再試（若持續發生可能是伺服器忙碌，非您的網路問題）</div>';
  }
}

// 強制重新整理：封存機制上線後主表本身就會維持精簡，修繕管理/姓名查詢/GM模式返璞歸真，
// 統一改成用loadCases()把主表資料整包讀進allCases，篩選/排序/分頁都在瀏覽器裡做，
// 不再各自維護一套後端分頁API、快取版本號、進行中請求合併——這些機制在案件量小的現況下，
// 帶來的複雜度已經大於它們省下來的效能，反而增加彼此互動出bug的風險。
function applyServerCasePatch_(serverCase, serverVersion, opts = {}) {
  if (!serverCase) return false;
  const idx = allCases.findIndex(c => c.caseId === serverCase.caseId || c.rowIndex === serverCase.rowIndex);
  if (idx < 0) {
    // 手上的清單可能是較小範圍；不硬塞未知案件，下一次 version sync 會拿正式清單。
    lastCasesLoadTime = 0;
    return false;
  }

  const old = allCases[idx];
  const patched = { ...old, ...serverCase };
  // 實際照片網址是 lazy-load 的記憶體資料；後端 Compact Case 只回張數。
  // 張數沒變才保留已載入網址，張數變了就清掉，下一次展開重新抓，避免顯示已刪除/舊照片。
  if (old.reportPhotos !== undefined && old.reportPhotoCount === serverCase.reportPhotoCount) patched.reportPhotos = old.reportPhotos;
  else if (serverCase.reportPhotoCount !== undefined && old.reportPhotoCount !== serverCase.reportPhotoCount) delete patched.reportPhotos;
  if (old.closePhotos !== undefined && old.closePhotoCount === serverCase.closePhotoCount) patched.closePhotos = old.closePhotos;
  else if (serverCase.closePhotoCount !== undefined && old.closePhotoCount !== serverCase.closePhotoCount) delete patched.closePhotos;

  allCases[idx] = patched;

  // 重要：serverVersion 是『這次局部寫入完成後的整體版本』，但前端只 patch 一筆案件，
  // 不能因此宣稱整份 allCases 已同步到該版本；否則多人同時操作時可能漏掉別人的異動。
  // 保留原本已完整同步的版本，並把 lastCasesLoadTime 歸零，下一次切頁/回到App時會立刻做 version sync。
  if (opts.trustServerVersion) lastCasesServerVersion = serverVersion || lastCasesServerVersion;
  lastCasesLoadTime = 0;
  // 更新/結案可能改變狀態、區域、案件類型、結案人或標記；舊 Dashboard snapshot 不能繼續被30秒節流視為最新。
  dashboardSnapshot = null;
  dashboardCube = null;
  dashboardVersions = null;
  dashboardDatasetKey = '';
  locationStatsMemoryCache.clear();
  lastDashboardLoadTime = 0;
  fullHistoryCasesCache_ = null;
  fullHistoryCasesLoadedAt_ = 0;
  try { localStorage.removeItem(DASHBOARD_SNAPSHOT_CACHE_KEY); } catch(e) {}
  if (lastLoadedDays === 'all') saveDashboardCache(allCases);
  else saveCasesCache(allCases);
  renderCurrentPage();
  return true;
}

// 修繕管理清單：直接從allCases依狀態/區域/關鍵字篩選、排序、切頁，全部在瀏覽器裡做，不用另外打API。
function renderCases() {
  const list = document.getElementById('caseList');
  let filtered = allCases.filter(c => c.status === currentFilter);
  if (currentMgrArea !== 'all') filtered = filtered.filter(c => areaMatchesFilter(effArea(c), currentMgrArea));
  if (mgrPriorityOnly) filtered = filtered.filter(c => !!c.todayPriority);
  const keyword = (document.getElementById('mgrSearchInput')?.value || '').trim().toLowerCase();
  if (keyword) {
    filtered = filtered.filter(c => {
      const haystack = [
        c.caseId, c.area, effArea(c), c.location, c.normalizedLocation,
        c.description, c.name, c.unit, c.locationType, c.caseType, c.repairNote, c.priorityReason
      ].filter(Boolean).join(' ').toLowerCase();
      return haystack.includes(keyword);
    });
  }
  // 待處理依報修日期新到舊排序，已結案依結案日期(沒有就用報修日期)新到舊排序
  const toTs = (raw) => {
    if (!raw) return 0;
    const d = new Date(String(raw).replace(/-/g,'/'));
    return isNaN(d) ? 0 : d.getTime();
  };
  if (currentFilter==='已結案') {
    filtered = [...filtered].sort((a,b)=> toTs(b.closeDatetime||b.datetime||b.date) - toTs(a.closeDatetime||a.datetime||a.date));
  } else {
    // 今日優先永遠置頂；同為今日優先或一般案件時，再依報修時間新到舊。
    filtered = [...filtered].sort((a,b)=> (Number(!!b.todayPriority)-Number(!!a.todayPriority)) || (toTs(b.datetime||b.date)-toTs(a.datetime||a.date)));
  }
  managerCasesTotal = filtered.length;
  const totalPages = Math.max(1, Math.ceil(managerCasesTotal/MGR_PAGE_SIZE));
  if (mgrPage>totalPages) mgrPage=totalPages;
  managerCases = filtered.slice((mgrPage-1)*MGR_PAGE_SIZE, mgrPage*MGR_PAGE_SIZE);
  if (!managerCases.length) {
    // 已結案分頁顯示「沒有案件」時，容易誤會成「這個篩選條件從來沒有案件」，
    // 但實際上可能只是7天內剛好沒有，更早的已經被封存機制搬走了，加個提示避免誤解
    const hint = currentFilter==='已結案'
      ? '查無符合條件的近期已結案案件<br><span style="font-size:12px;color:#bbb;">結案超過7天的案件會自動搬到封存，如需查詢較久以前的紀錄，請至「後台統計」或下載備份查詢</span>'
      : '目前沒有案件';
    list.innerHTML=`<div class="empty-state">${hint}</div>`;
    document.getElementById('mgrPagination').innerHTML=''; renderLoadMoreBtn('mgrLoadMoreWrap'); return;
  }
  renderManagerCaseList();
  renderLoadMoreBtn('mgrLoadMoreWrap'); // 篩選出來的案件可能超過目前allCases載入的近期視窗，保留「載入更早案件」按鈕擴大範圍
}

function renderManagerCaseList() {
  const list = document.getElementById('caseList');
  const totalPages = Math.max(1, Math.ceil(managerCasesTotal/MGR_PAGE_SIZE));

  list.innerHTML = managerCases.map(c => {
    const isFlagged = !!c.flagReason;
    const area = effArea(c);
    const areaClass = area.startsWith('會館') ? 'area-館' : area.startsWith('雅舍') ? 'area-雅' : area.startsWith('研究') ? 'area-研' : area.startsWith('智尊') ? 'area-智' : 'area-其';
    const cls = (isFlagged ? 'case-card is-flagged' : currentFilter==='已結案' ? 'case-card is-closed' : 'case-card') + ' ' + areaClass;
    const locDisplay = c.normalizedLocation || c.location || '—';
    const titleHtml = `${area} · ${locDisplay}${c.locationType ? ' <span style="font-size:11px;background:#FEF0E3;color:#C05E0A;padding:2px 8px;border-radius:20px;font-weight:600;">'+c.locationType+'</span>' : ''}`;
    const badgeHtml = `<span class="badge ${isFlagged?'flagged':c.status==='待處理'?'pending':'done'}">${isFlagged?'已標記':c.status}</span>`;
    const photoTag = [
      (c.reportPhotoCount||(c.reportPhotos&&c.reportPhotos.length)) ? `📷報修${c.reportPhotoCount||c.reportPhotos.length}` : '',
      (c.closePhotoCount||(c.closePhotos&&c.closePhotos.length)) ? `📷結案${c.closePhotoCount||c.closePhotos.length}` : '',
    ].filter(Boolean).join(' ');
    // 已結案分頁改顯示「結案時間」(含時分)而不是報修日期，不然卡片上看到的日期跟排序依據(結案時間)對不起來，容易誤會排序跑掉
    const shortDate = currentFilter==='已結案'
      ? (c.closeDatetime||'').replace(/^\d{4}\//,'').replace(/(\d{1,2}:\d{2}):\d{2}$/,'$1') // 去掉年份跟秒數，「2026/08/06 15:45:32」→「08/06 15:45」；舊資料沒有秒數的話原樣保留，不會誤砍掉分鐘
      : (c.datetime||c.date||'').split(' ')[0].replace(/^\d{4}\//,'');
    const dateLabelPrefix = currentFilter==='已結案' ? '✅結案 ' : '';

    const stampHtml = isFlagged ? `<div class="flag-stamp">${c.flagReason||'已標記'}</div>` : '';

    // 收合摘要照常整包渲染(這是使用者最常看到的部分)；完整編輯表單改成空殼，
    // 第一次點開這張卡片時(toggleCardEdit)才真的去建立內容，案件很多時不會一次把所有表單都塞進DOM
    const collapsedView = `
      <div class="case-collapsed" id="collapsed-${c.rowIndex}" onclick="toggleCardEdit(${c.rowIndex})">
        ${stampHtml}
        ${priorityBannerHtml(c)}
        <div class="case-row-top">
          <div class="case-row-title">${titleHtml}</div>
          ${badgeHtml}
        </div>
        <div class="case-row-meta">${dateLabelPrefix}${shortDate} · ${c.unit} · ${c.name}${photoTag?` · <span class="photo-tag">${photoTag}</span>`:''}</div>
        <div class="case-row-desc">${c.description}</div>
        ${c.repairNote?`<div class="case-row-note">✅ ${c.repairNote}</div>`:''}
      </div>`;

    const expandedPlaceholder = `<div class="case-expanded" id="expanded-${c.rowIndex}" style="display:none"></div>`;

    return `<div class="${cls}">${collapsedView}${expandedPlaceholder}</div>`;
  }).join('');

  renderPagination('mgrPagination', mgrPage, totalPages, p=>{mgrPage=p;renderCases();});
  // 效能/穩定性：清單不再背景預抓整頁照片；只有展開案件或點照片時才讀取。
}

// 共用：純顯示用的照片區塊(案件查詢/鑽取彈窗)。還沒載入時顯示可點擊的張數提示，點了才真的去抓照片網址。
function photoDisplayBlock(c, kind, label) {
  const photos = kind === 'report' ? c.reportPhotos : c.closePhotos;
  const count = kind === 'report' ? (c.reportPhotoCount||0) : (c.closePhotoCount||0);
  if (photos !== undefined) {
    return photos.length ? `<div style="margin-top:8px;font-size:11px;color:#aaa;">${label}：</div><div class="photo-preview-wrap">${photos.map(url=>`<img class="photo-preview-img" src="${url}" onclick="window.open('${url}')">`).join('')}</div>` : '';
  }
  if (!count) return '';
  return `<div class="photo-count-hint" style="cursor:pointer;" onclick="loadAndShowPhotos(${c.rowIndex},this,'${kind}')">📷 ${label} ${count} 張（點擊查看）</div>`;
}

// 點擊張數提示時才真的去抓這筆案件的照片，抓到後直接把提示換成實際照片
// 背景批次預抓照片：清單渲染完後自動呼叫，一次把「這一頁看得到的案件」的照片都抓回來，
// 不用等使用者點擊，也不會一張案件各打一次getPhotos(那樣才會常常卡住)
let photoPrefetchInFlight = new Set(); // 記錄正在抓取中的rowIndex，避免同一批被重複觸發
async function prefetchPhotosForCases(casesArr) {
  const targets = casesArr.filter(c =>
    c.reportPhotos === undefined &&
    (c.reportPhotoCount || c.closePhotoCount) &&
    !photoPrefetchInFlight.has(c.rowIndex)
  );
  if (!targets.length) return;
  targets.forEach(c => photoPrefetchInFlight.add(c.rowIndex));
  try {
    const rowIndexes = targets.map(c => c.rowIndex).join(',');
    const data = await callReadApi_({ action:'getPhotosForRows', rowIndexes }, 15000);
    if (data.success) {
      targets.forEach(c => {
        const p = data.photos[c.rowIndex];
        if (p) {
          c.reportPhotos = p.reportPhotos;
          c.closePhotos = p.closePhotos;
          renderCasePhotoSlots(c); // 修繕管理展開視圖若剛好開著，順便更新
        }
      });
      // 若鑽取詳情面板剛好開著、顯示的正是這筆案件，直接重新整個面板(格式含分隔線/標籤比較完整)
      const panelOpen = document.getElementById('caseDetailPanel').classList.contains('open');
      const panelCaseId = document.getElementById('panelCaseId').textContent;
      targets.forEach(c => {
        if (c.reportPhotos === undefined) return;
        if (panelOpen && panelCaseId === c.caseId) {
          openCasePanel(c);
          return;
        }
        // 其餘情況(修繕管理清單/案件查詢卡片)：悄悄局部更新張數提示，換成實際縮圖，不整頁重繪
        document.querySelectorAll(`[onclick*="loadAndShowPhotos(${c.rowIndex},"]`).forEach(hintEl => {
          const kindMatch = hintEl.getAttribute('onclick').match(/'(\w+)'\)$/);
          const kind = kindMatch ? kindMatch[1] : 'report';
          const label = kind === 'report' ? '報修照片' : '結案照片';
          const wrap = document.createElement('div');
          wrap.innerHTML = photoDisplayBlock(c, kind, label);
          if (wrap.childNodes.length) hintEl.replaceWith(...wrap.childNodes);
        });
      });
    }
  } catch(e) {
    console.error('prefetchPhotosForCases 失敗:', e);
    // 背景預抓失敗不用特別提示使用者，畫面上的「點擊查看」提示還在，仍可手動點擊重試
  } finally {
    targets.forEach(c => photoPrefetchInFlight.delete(c.rowIndex));
  }
}

async function loadAndShowPhotos(rowIndex, hintEl, kind) {
  const c = findCaseByRowIndex_(rowIndex);
  if (!c) return;
  const label = kind === 'report' ? '報修照片' : '結案照片';

  // 另一種類型可能已經被點過、資料已經在記憶體裡了，這種情況不用再打API，直接渲染
  const alreadyLoaded = kind === 'report' ? c.reportPhotos !== undefined : c.closePhotos !== undefined;
  if (alreadyLoaded) {
    const wrap = document.createElement('div');
    wrap.innerHTML = photoDisplayBlock(c, kind, label);
    hintEl.replaceWith(...wrap.childNodes);
    return;
  }

  hintEl.textContent = '載入中…';
  try {
    const data = await callReadApi_({ action:'getPhotos', rowIndex }, 15000);
    if (data.success) {
      c.reportPhotos = data.reportPhotos;
      c.closePhotos = data.closePhotos;
      const wrap = document.createElement('div');
      wrap.innerHTML = photoDisplayBlock(c, kind, label); // 只換掉被點擊的這一種，不動另一種的提示
      hintEl.replaceWith(...wrap.childNodes);
    } else {
      hintEl.textContent = '⚠️ 載入失敗（點擊重試）：' + (data.message||'未知錯誤');
    }
  } catch(e) {
    console.error('loadAndShowPhotos 失敗:', e);
    hintEl.textContent = '⚠️ 照片載入失敗（點擊重試）';
  }
}

function toggleAdvancedFields(rowIndex, el) {
  event.stopPropagation();
  const box = document.getElementById('advanced-'+rowIndex);
  if (!box) return;
  const isOpen = box.style.display !== 'none';
  box.style.display = isOpen ? 'none' : 'block';
  el.textContent = isOpen ? '更多修正選項（區域/位置/標準化/標記） ▾' : '收起修正選項 ▴';
}

async function toggleCardEdit(rowIndex) {
  const collapsed = document.getElementById('collapsed-'+rowIndex);
  const expanded = document.getElementById('expanded-'+rowIndex);
  if (!collapsed || !expanded) return;
  const card = collapsed.closest('.case-card');
  if (expanded.style.display === 'none') {
    if (!expanded.dataset.built) {
      // 第一次展開這張卡片，才真的把完整編輯表單建出來；收合再展開直接重用，不會重建
      const c = findCaseByRowIndex_(rowIndex);
      if (!c) return;
      expanded.innerHTML = renderExpandedInner(c);
      expanded.dataset.built = '1';
    }
    collapsed.style.display = 'none';
    expanded.style.display = 'block';
    if (card) card.classList.add('expanded-card');
    ensureCasePhotosLoaded(rowIndex); // 第一次展開這張卡片時才去抓照片，之後收合再展開不會重抓
  } else {
    collapsed.style.display = 'block';
    expanded.style.display = 'none';
    if (card) card.classList.remove('expanded-card');
  }
}

// 照片改成「點開才載入」：清單本身只給張數，真的展開某張案件卡片時才另外打一次輕量請求拿實際網址
async function ensureCasePhotosLoaded(rowIndex) {
  const c = findCaseByRowIndex_(rowIndex);
  if (!c || c.closePhotos !== undefined) return; // undefined代表還沒抓過；已經抓過就不重複打
  // 案件本身沒有照片時(報修+結案張數都是0)，根本不用打API去問——本來的清單資料就已經告訴我們答案了，
  // 之前這裡沒做這個判斷，導致「完全沒照片的案件」每次點開都會多一次白白等待的網路來回，這才是主要的延遲來源
  if (!c.reportPhotoCount && !c.closePhotoCount) {
    c.reportPhotos = [];
    c.closePhotos = [];
    renderCasePhotoSlots(c);
    return;
  }
  try {
    const data = await callReadApi_({ action:'getPhotos', rowIndex }, 15000);
    if (data.success) {
      c.reportPhotos = data.reportPhotos;
      c.closePhotos = data.closePhotos;
      renderCasePhotoSlots(c);
    } else {
      console.error('getPhotos 回傳失敗:', data.message);
      renderCasePhotoSlotsError(rowIndex);
    }
  } catch(e) {
    console.error('getPhotos 失敗:', e);
    renderCasePhotoSlotsError(rowIndex);
  }
}

// 照片載入失敗時，展開視圖的照片欄位顯示可重試的錯誤狀態，不會卡在「…」載入中永遠不動
function renderCasePhotoSlotsError(rowIndex) {
  const slot0 = document.getElementById(`close-slot-${rowIndex}-0`);
  const slot1 = document.getElementById(`close-slot-${rowIndex}-1`);
  const retryHtml = `<span class="photo-loading" style="cursor:pointer;font-size:11px;" onclick="event.stopPropagation();retryLoadCasePhotos(${rowIndex})">⚠️ 重試</span>`;
  if (slot0) slot0.innerHTML = retryHtml;
  if (slot1) slot1.innerHTML = '';
  const wrap = document.getElementById(`reportPhotosWrap-${rowIndex}`);
  if (wrap) wrap.innerHTML = `<div style="font-size:11px;color:#e05252;margin-top:8px;cursor:pointer;" onclick="retryLoadCasePhotos(${rowIndex})">⚠️ 報修照片載入失敗，點擊重試</div>`;
}

function retryLoadCasePhotos(rowIndex) {
  const c = findCaseByRowIndex_(rowIndex);
  if (c) { c.reportPhotos = undefined; c.closePhotos = undefined; } // 重設成「未載入」狀態，讓ensureCasePhotosLoaded願意重抓
  const slot0 = document.getElementById(`close-slot-${rowIndex}-0`);
  const slot1 = document.getElementById(`close-slot-${rowIndex}-1`);
  if (slot0) slot0.innerHTML = '<span class="photo-loading">…</span>';
  if (slot1) slot1.innerHTML = '<span class="photo-loading">…</span>';
  const wrap = document.getElementById(`reportPhotosWrap-${rowIndex}`);
  if (wrap) wrap.innerHTML = '<div style="font-size:11px;color:#ccc;margin-top:8px;">照片載入中…</div>';
  ensureCasePhotosLoaded(rowIndex);
}

// 把剛拿到的照片網址，局部更新進展開視圖的照片欄位(不整頁重繪，避免打斷正在編輯的其他卡片)
function renderCasePhotoSlots(c) {
  const slot0 = document.getElementById(`close-slot-${c.rowIndex}-0`);
  const slot1 = document.getElementById(`close-slot-${c.rowIndex}-1`);
  if (slot0) slot0.innerHTML = c.closePhotos[0]
    ? `<img src="${c.closePhotos[0]}"><div class="photo-del" onclick="event.stopPropagation();removePhoto('close-${c.rowIndex}',0)">×</div>`
    : '<span class="photo-add">+</span>';
  if (slot1) slot1.innerHTML = c.closePhotos[1]
    ? `<img src="${c.closePhotos[1]}"><div class="photo-del" onclick="event.stopPropagation();removePhoto('close-${c.rowIndex}',1)">×</div>`
    : '<span class="photo-add">+</span>';
  const wrap = document.getElementById(`reportPhotosWrap-${c.rowIndex}`);
  if (wrap) {
    wrap.innerHTML = c.reportPhotos.length
      ? `<div style="margin-top:8px;font-size:11px;color:#aaa;">報修照片：</div><div class="photo-preview-wrap">${c.reportPhotos.map((url,idx)=>`<div style="position:relative;display:inline-block;"><img class="photo-preview-img" src="${url}" onclick="window.open('${url}')"><div class="photo-del" onclick="event.stopPropagation();deleteReportPhoto(${c.rowIndex},${idx})">×</div></div>`).join('')}</div>`
      : '';
  }
}

}

function getSelectedLocType(rowIndex) {

function toggleCaseType(rowIndex, type, btn) {

function getSelectedCloser(rowIndex) {
  const el = document.getElementById('closer-'+rowIndex);
  if (!el) return '';
  const fixedNames = ['林益程','劉奕錦','余冠魁','鄭嘉榮','高賓瞬','郭于賢'];
  const selected = [];
  el.querySelectorAll('.flag-btn.active-flag').forEach(b => {

      const input = document.getElementById('closer-other-'+rowIndex);

      if (val) selected.push(val);

function toggleFlag(rowIndex, reason, btn) {
  const btns = document.getElementById('flags-'+rowIndex).querySelectorAll('.flag-btn');
  const wasActive = btn.classList.contains('active-flag');
  btns.forEach(b=>b.classList.remove('active-flag'));
  if (!wasActive) {
    btn.classList.add('active-flag');
    autoCloseAsFlagged(rowIndex, reason);
  }

async function autoCloseAsFlagged(rowIndex, reason) {

// 實際發送一次請求(不含重試邏輯)
async function callApiOnce(params, timeoutMs) {
  const token = localStorage.getItem('adminToken');
  let response;
  try {
    response = await fetchWithTimeout(API_URL, {
      method: 'POST',
      body: JSON.stringify({ ...params, token })
    }, timeoutMs || 20000); // 預設20秒(一般更新)，結案/報告生成等較重的動作由呼叫端傳入更長的逾時
  } catch (e) {
    console.error('callApi 網路層錯誤:', e);
    throw new Error(e.message === '請求逾時，請稍後再試' ? e.message : '網路目前不穩定，請再試一次');
  }
  const text = await response.text();
  if (!response.ok) {
    console.error('callApi HTTP錯誤:', response.status, text);
    throw new Error('系統暫時無法連線，請稍後再試');
  }
  if (!text) {
    console.error('callApi 回傳空內容');
    throw new Error('系統暫時忙碌，請稍後再試');
  }
  let data;
  try {
    data = JSON.parse(text);
  } catch (e) {
    console.error('callApi JSON解析失敗:', text);
    throw new Error('系統暫時忙碌，請稍後再試');
  }
  if (data && data.code === 'UNAUTHORIZED') {
    clearStoredAuth();
    document.getElementById('logoutBtn').style.display='none';
    pendingPage = currentPageId;
    showLock();
    showToast('登入已過期，請重新登入');
  }
  return data;
}

// 對外用的callApi：失敗時安靜自動重試一次，中間等1.5秒再試
// (背景推測：後端其實常常有把事情做完，只是手機在等待期間網路瞬斷或切到背景，導致這次請求連線中斷；
//  安靜重試一次可以撐過這種暫時性狀況，不用讓使用者自己再按一次)
// callApi只用於「寫入類」動作(更新/結案/生成報告/刪除照片等)，這些動作都有副作用(建立雲端硬碟檔案、
// 寫入試算表)，如果自動重試、而第一次其實已經成功(只是回應沒送達手機)，重試會造成重複結案/重複照片/重複報告。
// 所以這裡刻意不做自動重試，失敗就讓使用者自己決定要不要再按一次。
async function callApi(params, timeoutMs) {
  return await callApiOnce(params, timeoutMs);
}

    const hint = currentQueryStatusFilter!=='待處理'

function renderQueryGm() {
  const list = document.getElementById('queryListGm');
  let filtered = allCases;
  if (currentQueryFilter!=='all') filtered=filtered.filter(c=>c.status===currentQueryFilter);
  // 範圍鎖定(如營運快捷字設定的會館+雅舍)永遠是外層邊界，不管區域按鈕怎麼點都不會超出這個範圍
  if (currentQueryAreaScope) {
    filtered = filtered.filter(c => currentQueryAreaScope.some(a => areaMatchesFilter(effArea(c), a)));
    // 營運範圍檢視不顯示「園區營繕」單位自己報修的工單
    filtered = filtered.filter(c => c.unit !== '園區營繕');
  }
  if (currentQueryArea!=='all') {
    filtered=filtered.filter(c=>areaMatchesFilter(effArea(c),currentQueryArea));
  }
  const kw = currentQueryKeyword.toLowerCase();
  if (kw) {
    filtered = filtered.filter(c => {
      const haystack = [
        c.caseId, c.area, effArea(c), c.location, c.normalizedLocation,
        c.description, c.name, c.unit, c.locationType, c.caseType, c.repairNote, c.priorityReason
      ].filter(Boolean).join(' ').toLowerCase();
      return haystack.includes(kw);
    });
  }
  if (!filtered.length) {
    const hint = currentQueryFilter==='已結案'
      ? '查無符合條件的近期已結案案件<br><span style="font-size:12px;color:#bbb;">結案超過7天的案件會自動搬到封存，如需查詢較久以前的紀錄，請至「後台統計」或下載備份查詢</span>'
      : '目前沒有案件';
    list.innerHTML=`<div class="empty-state">${hint}</div>`;
    document.getElementById('queryPaginationGm').innerHTML=''; renderLoadMoreBtn('queryLoadMoreWrap'); return;
  }
  const totalPages = Math.ceil(filtered.length/PAGE_SIZE);
  if (queryPage>totalPages) queryPage=totalPages;
  const paged = filtered.slice((queryPage-1)*PAGE_SIZE, queryPage*PAGE_SIZE);
  list.innerHTML = paged.map(c => renderPubCard(c)).join('');
  renderPagination('queryPaginationGm', queryPage, totalPages, p=>{queryPage=p;renderQueryGm();});
  renderLoadMoreBtn('queryLoadMoreWrap');
  // 清單照片改為真正 lazy-load，不在翻頁/重繪時背景打 API。
}

// ── 分頁 ──
function renderPagination(containerId, current, total, onChange) {
  const el = document.getElementById(containerId);
  if (total<=1) { el.innerHTML=''; return; }
  let html = `<button class="page-btn" ${current===1?'disabled':''} onclick="paginationGo('${containerId}',${current-1})">‹</button>`;
  for (let i=1; i<=total; i++) {
    if (total>7 && i>2 && i<total-1 && Math.abs(i-current)>1) {
      if (i===3||i===total-2) html+=`<span class="page-ellipsis">…</span>`;
      continue;
    }
    html+=`<button class="page-btn${i===current?' active':''}" onclick="paginationGo('${containerId}',${i})">${i}</button>`;
  }
  html+=`<button class="page-btn" ${current===total?'disabled':''} onclick="paginationGo('${containerId}',${current+1})">›</button>`;
  el.innerHTML=html;
  el._onChange = onChange;
}

function paginationGo(containerId, page) {
  const el = document.getElementById(containerId);
  if (el && el._onChange) {
    el._onChange(page);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function formatDatetime(raw) {
  if (!raw) return '';
  const weekdays = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  // Try to parse
  const m = String(raw).match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if (m) {
    const d = new Date(parseInt(m[1]), parseInt(m[2])-1, parseInt(m[3]));
    const day = weekdays[d.getDay()];
    return `${m[1]}/${String(m[2]).padStart(2,'0')}/${String(m[3]).padStart(2,'0')} ${day}`;
  }
  // GMT string fallback
  const d = new Date(raw);
  if (!isNaN(d)) {
    const y = d.getFullYear();
    const mo = String(d.getMonth()+1).padStart(2,'0');
    const dd = String(d.getDate()).padStart(2,'0');
    const day = weekdays[d.getDay()];
    return `${y}/${mo}/${dd} ${day}`;
  }
  return raw;
}

function dateBadge(label, dateStr, bg, color) {
  if (!dateStr) return '';
  return `<span style="display:inline-flex;align-items:center;gap:4px;background:${bg};color:${color};font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;margin-right:6px;">${label} ${formatDatetime(dateStr)}</span>`;
}

function parseDate(raw) {
  if (!raw) return null;
  const m1 = String(raw).match(/(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);
  if (m1) return new Date(parseInt(m1[1]), parseInt(m1[2])-1, parseInt(m1[3]));
  const d = new Date(raw);
  return isNaN(d) ? null : d;
}

// ── 圓餅圖 ──
function renderPieChart(containerId, counts, colors, total, clickHandler) {
  const el = document.getElementById(containerId);
  const entries = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  if (!entries.length) { el.innerHTML='<div class="empty-state" style="padding:20px 0;">暫無資料</div>'; return; }
  const sum = entries.reduce((a,b)=>a+b[1],0);
  const size = 160;
  const cx = size/2, cy = size/2, r = 68, innerR = 36;
  let startAngle = -Math.PI/2;
  let slices = '';
  entries.forEach(([label, val]) => {
    const angle = (val/sum)*Math.PI*2;
    const endAngle = startAngle + angle;
    const x1=cx+r*Math.cos(startAngle), y1=cy+r*Math.sin(startAngle);
    const x2=cx+r*Math.cos(endAngle), y2=cy+r*Math.sin(endAngle);
    const ix1=cx+innerR*Math.cos(startAngle), iy1=cy+innerR*Math.sin(startAngle);
    const ix2=cx+innerR*Math.cos(endAngle), iy2=cy+innerR*Math.sin(endAngle);
    const largeArc = angle > Math.PI ? 1 : 0;
    const color = colors[label]||'#bbb';
    const clickAttr = clickHandler ? ` style="cursor:pointer;" onclick="${clickHandler}('${label}')"` : '';
    slices += `<path d="M${ix1},${iy1} L${x1},${y1} A${r},${r} 0 ${largeArc},1 ${x2},${y2} L${ix2},${iy2} A${innerR},${innerR} 0 ${largeArc},0 ${ix1},${iy1} Z" fill="${color}" stroke="white" stroke-width="2"${clickAttr}/>`;
    startAngle = endAngle;
  });
  const legend = entries.map(([label,val])=>`
    <div class="pie-legend-item"${clickHandler?` style="cursor:pointer;" onclick="${clickHandler}('${label}')"`:''}>
      <div class="pie-legend-dot" style="background:${colors[label]||'#bbb'}"></div>
      <span class="pie-legend-label">${label}</span>
      <span class="pie-legend-val">${val}件 ${Math.round(val/sum*100)}%</span>
    </div>`).join('');
  el.innerHTML = `<div class="pie-wrap">
    <div class="pie-canvas-wrap">
      <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${slices}
        <text x="${cx}" y="${cy-6}" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">${sum}</text>
        <text x="${cx}" y="${cy+12}" text-anchor="middle" font-size="10" fill="#aaa">總案件</text>
      </svg>
    </div>
    <div class="pie-legend">${legend}</div>
  </div>`;
}

function getDeviceFingerprint() {
  const ua = navigator.userAgent;
  const lang = navigator.language || '';
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
  const screen = `${window.screen.width}x${window.screen.height}x${window.screen.colorDepth}`;
  const raw = [ua, lang, tz, screen].join('|');
  let hash = 0;
  for (let i = 0; i < raw.length; i++) {
    hash = ((hash << 5) - hash) + raw.charCodeAt(i);
    hash |= 0;
  }
  return 'FP' + Math.abs(hash).toString(16).toUpperCase().padStart(8,'0');
}

async function downloadBackup(btn) {
  if (btn) { btn.disabled = true; btn.textContent = '準備中…'; }
  try {
    // 不再依賴前端手上的allCases(可能是舊資料、也可能只進過管理頁完全沒載入過)，
    // 使用者實際按下這顆按鈕時才向後端要一次完整、含照片網址的資料
    const data = await callReadApi_({ action:'getFullBackup' }, 60000);
    if (!data.success) throw new Error(data.message || '備份資料取得失敗');
    if (!data.cases || !data.cases.length) { showToast('沒有可備份的資料'); return; }
    const payload = { exportedAt: data.exportedAt, count: data.count, cases: data.cases };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const ts = new Date();
    const stamp = `${ts.getFullYear()}${String(ts.getMonth()+1).padStart(2,'0')}${String(ts.getDate()).padStart(2,'0')}_${String(ts.getHours()).padStart(2,'0')}${String(ts.getMinutes()).padStart(2,'0')}`;
    a.href = url;
    a.download = `渴望園區報修系統_備份_${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('✓ 備份已下載');
  } catch(e) {
    console.error('downloadBackup 失敗:', e);
    showToast('❌ 備份下載失敗，請稍後再試');
  }
  if (btn) { btn.disabled = false; btn.textContent = '💾 下載備份'; }
}

async function importBackup(file) {
  if (!file) return;
  if (!confirm('匯入備份將會把檔案內的所有案件還原到系統，可能與現有資料合併或覆蓋，確定要繼續嗎？')) {
    document.getElementById('backupFileInput').value = '';
    return;
  }
  try {
    const text = await file.text();
    const payload = JSON.parse(text);
    const cases = Array.isArray(payload) ? payload : payload.cases;
    if (!Array.isArray(cases) || !cases.length) { showToast('備份檔案格式錯誤或無資料'); return; }
    showToast('匯入中，請稍候…');
    // 匯入也是有副作用的寫入，統一走 callApi：不自動 retry，但共用 HTTP/空內容/JSON/登入過期處理。
    const data = await callApi({ action:'import', cases }, 90000);
    if (data.success) {
      const skipMsg = data.skipped ? `，略過重複 ${data.skipped} 筆` : '';
      showToast('✓ 匯入完成，新增 '+data.imported+' 筆'+skipMsg);
      lastCasesServerVersion = null;
      clearCasesCache();
      dashboardSnapshot = null;
      dashboardCube = null;
      dashboardVersions = null;
      dashboardDatasetKey = '';
      locationStatsMemoryCache.clear();
      lastDashboardLoadTime = 0;
      fullHistoryCasesCache_ = null;
      fullHistoryCasesLoadedAt_ = 0;
      try { localStorage.removeItem(DASHBOARD_SNAPSHOT_CACHE_KEY); } catch(e) {}
      await loadCases(true);
    } else {
      showToast('匯入失敗：'+(data.message||'未知錯誤'));
    }
  } catch(e) {
    showToast('匯入失敗，檔案格式錯誤或連線問題');
  }
  document.getElementById('backupFileInput').value = '';
}

// 統計頁資料載入：先讀本機快取立即顯示上次的統計結果，背景向後端要最新的(getDashboardSnapshot)。
// 全部時間+全部區域(最常見的預設檢視)後端會走快速路徑(主表即時算+封存表預先算好的快照)，其餘情況即時掃描。

async function loadDashboardSnapshot(force) {
  const mySeq=++dashboardSnapshotSeq, params=dashboardDatasetParams(), key=dashboardParamsKey_(params);
  if(force){
    locationStatsSeq++; locationStatsInFlightKey=''; locationStatsMemoryCache.clear();
    const el=document.getElementById('locationTable'); if(el)el.innerHTML='<div class="empty-state" style="padding:20px 0;">位置統計載入中…</div>';
  }

  if(!force&&dashboardCube&&dashboardDatasetKey===key&&Date.now()-lastDashboardLoadTime<CASES_AUTO_REFRESH_INTERVAL){
    dashboardSnapshot=dashboardCube.areas[currentAreaDashFilter]||dashboardCube.areas.all;
    renderDashboard(); loadDashboardLocationStats(0); return;
  }

  if(!dashboardCube||dashboardDatasetKey!==key){
    const cached=loadSnapshotCache(params);
    if(cached){
      dashboardCube=cached.cube; dashboardVersions=cached.versions||{}; dashboardDatasetKey=key;
      dashboardSnapshot=dashboardCube.areas[currentAreaDashFilter]||dashboardCube.areas.all||null;
      renderDashboard(); loadDashboardLocationStats(0);
      const mins=Math.round((Date.now()-cached.savedAt)/60000);
      renderSyncStatus(mins<1?'顯示上次統計資料，正在同步最新結果…':`顯示${mins}分鐘前的統計資料，正在同步最新結果…`);
    }
  }

  try {
    const data=await callReadApi_({action:'getDashboardSnapshot',year:params.year,month:params.month,dateFrom:params.dateFrom,dateTo:params.dateTo},45000);
    if(mySeq!==dashboardSnapshotSeq)return;
    if(!data.success||!data.cube||!data.cube.areas)throw new Error(data.message||'統計資料載入失敗');
    const oldVersion=dashboardVersions?JSON.stringify(dashboardVersions):'';
    const newVersion=JSON.stringify(data.versions||{});
    if(oldVersion&&oldVersion!==newVersion) locationStatsMemoryCache.clear();
    dashboardCube=data.cube; dashboardVersions=data.versions||{}; dashboardDatasetKey=key;
    dashboardSnapshot=dashboardCube.areas[currentAreaDashFilter]||dashboardCube.areas.all||null;
    lastDashboardLoadTime=Date.now(); saveSnapshotCache(dashboardCube,dashboardVersions,params);
    renderDashboard(); loadDashboardLocationStats(0);
    renderSyncStatus('✓ 統計資料已更新',{autoClear:true});
  } catch(e) {
    if(mySeq!==dashboardSnapshotSeq)return;
    console.error('loadDashboardSnapshot 失敗:',e);
    if(dashboardSnapshot)renderSyncStatus('⚠ 同步失敗，目前顯示上次統計資料',{warn:true});
    else showToast('❌ 統計資料載入失敗，請點右上角重新整理再試一次');
  }
}

async function loadDashboardLocationStats(page=0, force=false) {
  const p=dashboardQueryParams(), reqKey=JSON.stringify([p.year,p.month,p.dateFrom,p.dateTo,p.area,page]);
  if(!force&&locationStatsMemoryCache.has(reqKey)){
    const loc=locationStatsMemoryCache.get(reqKey);
    locPagerEntries=loc.entries||[]; locPagerPage=loc.page||0; locPagerTotalPages=loc.totalPages||1; locPagerTotalEntries=loc.totalEntries||0;
    locPagerMultiArea=!!loc.multiArea; locPagerMaxL=Math.max(loc.maxTotal||1,1); window.locEntryMeta={}; renderLocPage(); return;
  }
  if(!force&&reqKey===locationStatsInFlightKey)return;
  const mySeq=++locationStatsSeq; locationStatsInFlightKey=reqKey;
  const el=document.getElementById('locationTable'); if(el&&page===0)el.innerHTML='<div class="empty-state" style="padding:20px 0;">位置統計載入中…</div>';
  try {
    const data=await callReadApi_({action:'getDashboardLocationStats',year:p.year,month:p.month,dateFrom:p.dateFrom,dateTo:p.dateTo,area:p.area,page,pageSize:LOC_PAGE_SIZE},45000);
    if(mySeq!==locationStatsSeq)return;
    if(!data.success||!data.locations)throw new Error(data.message||'位置統計載入失敗');
    const loc=data.locations; locationStatsMemoryCache.set(reqKey,loc);
    locPagerEntries=loc.entries||[]; locPagerPage=loc.page||0; locPagerTotalPages=loc.totalPages||1; locPagerTotalEntries=loc.totalEntries||0;
    locPagerMultiArea=!!loc.multiArea; locPagerMaxL=Math.max(loc.maxTotal||1,1); window.locEntryMeta={}; renderLocPage();
  } catch(e) {
    if(mySeq!==locationStatsSeq)return;
    if(el)el.innerHTML='<div class="empty-state" style="padding:20px 0;color:#c0392b;cursor:pointer;" onclick="loadDashboardLocationStats(0,true)">⚠️ 位置統計載入失敗，點擊重試</div>';
    document.getElementById('locPagerNav').style.display='none';
  } finally { if(locationStatsInFlightKey===reqKey)locationStatsInFlightKey=''; }
}

function locPagerGo(dir) {

async function toggleLocDetail(id) {

  if (isOpen) {
    el.style.display = 'none';

  el.style.display = 'block';

function getPrintListFilteredCases() {
  const includeClosed = document.getElementById('printIncludeClosed').checked;
  const areas = getPrintListSelectedAreas();
  const sourceCases = (includeClosed && printHistoryCases_) ? printHistoryCases_ : allCases;
  let cases = sourceCases.filter(c => !c.flagReason);
  cases = cases.filter(c => includeClosed ? true : c.status === '待處理');
  if (areas) cases = cases.filter(c => areas.some(a => areaMatchesFilter(effArea(c), a)));
  cases.sort((a,b) => {
    if (a.status !== b.status) return a.status === '待處理' ? -1 : 1;
    if (a.status === '待處理' && !!a.todayPriority !== !!b.todayPriority) return a.todayPriority ? -1 : 1;
    return String(effArea(a)).localeCompare(String(effArea(b)));
  });
  return cases;
}

function setExportRange(range, btn) {
  exportRange = range;
  document.querySelectorAll('.export-range-btn').forEach(b => b.classList.remove('active-export'));
  btn.classList.add('active-export');
  document.getElementById('exportCustomRange').style.display = range === 'custom' ? 'block' : 'none';
}

function getExportCases(sourceCases = allCases) {
  const now = new Date();
  let cases = sourceCases.filter(c => !c.flagReason);
  if (exportRange === 'month') {
    cases = cases.filter(c => {
      const d = parseExportDate(c.datetime);
      return d && d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
    });
  } else if (exportRange === '3month') {
    cases = cases.filter(c => {
      const d = parseExportDate(c.datetime);
      return d && (now - d) <= 90*24*60*60*1000;
    });
  } else if (exportRange === 'custom') {
    const from = document.getElementById('exportDateFrom').value;
    const to = document.getElementById('exportDateTo').value;
    cases = cases.filter(c => {
      const d = parseExportDate(c.datetime);
      if (!d) return false;
      if (from && d < new Date(from)) return false;
      if (to && d > new Date(to + 'T23:59:59')) return false;
      return true;
    });
  }
  return cases;
}

function parseExportDate(raw) {
  if (!raw) return null;
  const m = String(raw).match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if (m) return new Date(parseInt(m[1]), parseInt(m[2])-1, parseInt(m[3]));
  const d = new Date(raw);
  return isNaN(d) ? null : d;
}

async function exportExcel() {
  const btn = document.getElementById('exportBtn');
  btn.textContent = '產生中…'; btn.disabled = true;

  // 匯出需要完整歷史，但使用獨立變數承接，不覆蓋全域 allCases（修繕管理仍只維持主表近期案件）。
  let exportSourceCases;
  try {
    btn.textContent = '載入歷史案件中…';
    exportSourceCases = await loadFullHistoryCases_(true);
  } catch(e) {
    showToast('歷史案件載入失敗：' + (e.message || '請稍後再試'));
    btn.textContent = '下載 Excel'; btn.disabled = false;
    return;
  }

  const cases = getExportCases(exportSourceCases);
  const includeDetail = document.getElementById('exportIncludeDetail').checked;
  const now = new Date();
  const rangeLabel = {month:'本月', '3month':'近三個月', all:'全部'}[exportRange] || (() => {
    const from = document.getElementById('exportDateFrom').value;
    const to = document.getElementById('exportDateTo').value;
    const fmt = s => s ? s.replace(/-/g,'/') : '';
    return from || to ? `${fmt(from)} ～ ${fmt(to)}` : '自訂';
  })();

  const total = cases.length;
  const pending = cases.filter(c => c.status === '待處理').length;
  const done = cases.filter(c => c.status === '已結案').length;
  const rate = total > 0 ? Math.round(done/total*100) : 0;

  // 各棟統計
  const areaMap = {};
  cases.forEach(c => {
    const a = effArea(c);
    if (!areaMap[a]) areaMap[a] = {total:0, done:0, pending:0};
    areaMap[a].total++;
    if (c.status==='已結案') areaMap[a].done++; else areaMap[a].pending++;
  });
  const areas = Object.entries(areaMap)
    .sort((a,b)=>b[1].total-a[1].total)
    .map(([name, stat]) => ({
      name, total: stat.total, done: stat.done, pending: stat.pending,
      rate: stat.total>0 ? Math.round(stat.done/stat.total*100) : 0
    }));

  // 維修類別（已結案）
  const typeCounts = {};
  cases.filter(c=>c.status==='已結案').forEach(c => {
    const ct = normalizeCaseType(c.caseType);
    if (ct) typeCounts[ct] = (typeCounts[ct]||0)+1;
  });
  const types = Object.entries(typeCounts)
    .sort((a,b)=>b[1]-a[1])
    .map(([name, cnt]) => ({name, cnt}));

  // 前10名未結案件（依等待天數）
  const exportNow = new Date();
  const pendingTop = exportSourceCases
    .filter(c => c.status === '待處理' && !c.flagReason)
    .map(c => {
      const d = parseDate(c.datetime || c.date);
      const daysWait = d ? Math.floor((exportNow - d) / 86400000) : 0;
      return { c, daysWait };
    })
    .sort((a,b) => b.daysWait - a.daysWait)
    .slice(0, 10)
    .map((e,i) => ({
      rank: i+1,
      loc: effArea(e.c)+' · '+(e.c.normalizedLocation||e.c.location||''),
      days: e.daysWait,
      date: e.c.datetime||e.c.date||'',
      desc: e.c.description||''
    }));

  // 案件明細
  const detail = includeDetail ? cases.map(c => ({
    caseId: c.caseId, datetime: c.datetime, unit: c.unit, name: c.name,
    area: effArea(c), locationType: c.locationType, location: c.location||'',
    description: c.description, status: c.status, repairNote: c.repairNote||'',
    caseType: normalizeCaseType(c.caseType)||'', closerName: c.closerName||''
  })) : [];

  const stats = { rangeLabel, total, pending, done, rate, areas, types, pendingTop, detail };

  try {
    const data = await callApi({ action: 'generateExcelReport', stats }, 60000);
    if (data.success) {
      const a = document.createElement('a');
      a.href = data.url;
      a.download = data.fileName || 'report.xlsx';
      a.target = '_blank';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      closeExportModal();
      showToast('✓ 報告已下載');
    } else {
      showToast('生成失敗：'+(data.message||'未知錯誤'));
    }
  } catch(e) {
    showToast('生成失敗：' + (e.message || '請檢查網路'));
  }

  btn.textContent = '下載 Excel'; btn.disabled = false;
}

async function handlePhotoUpload(prefix, idx, input) {
  const file = input.files[0];
  if (!file) return;
  let compressed;
  try {
    compressed = await compressImage(file, 600, 0.65);
  } catch(e) {
    showToast('照片檔案過大，請選擇較小的照片或詳述故障狀況即可');
    input.value = '';
    return;
  }
  const rowIndex = prefix.startsWith('close') ? prefix.slice(6) : null;
  const slotId = rowIndex ? `close-slot-${rowIndex}-${idx}` : `report-slot-${idx}`;
  const slot = document.getElementById(slotId);
  slot.innerHTML = `<img src="${compressed}"><div class="photo-del" onclick="event.stopPropagation();removePhoto('${prefix}',${idx})">×</div>`;

  if (!prefix.startsWith('close')) {
    if (!photoData.report) photoData.report = [null, null];
    photoData.report[idx] = compressed;
    // report-slot-1 預設已顯示
  } else {
    if (!photoData[prefix]) photoData[prefix] = [null, null];
    photoData[prefix][idx] = compressed;
    // close-slot 預設已顯示
  }
  input.value = '';
}

async function generateReport(rowIndex, btn) {
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = '生成中…';
  try {
    const data = await callApi({action:'generateReport', rowIndex}, 60000);
    if (data.success) {
      const a = document.createElement('a');
      a.href = data.url;
      a.download = data.fileName || 'report.pptx';
      a.target = '_blank';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      showToast('✓ 報告已生成');
    } else {
      showToast('生成失敗：'+(data.message||'未知錯誤'));
    }
  } catch(e) { showToast('生成失敗：' + (e.message || '請檢查網路')); }
  btn.disabled = false;
  btn.textContent = originalText;
}


async function deleteReportPhoto(rowIndex, idx) {
  if(!confirm('確定要刪除這張報修照片嗎？此操作無法復原。'))return;
  const c=findCaseByRowIndex_(rowIndex); if(!c){showToast('案件資料已更新，請重新整理');return;}
  try {
    const data=await callApi({action:'deletePhoto',caseId:c.caseId,rowHint:rowIndex,photoType:'report',index:idx});
    if(data.success){showToast('✓ 照片已刪除');applyServerCasePatch_(data.case,data.version);}
    else showToast('刪除失敗：'+(data.message||'未知錯誤'));
  } catch(e){showToast('刪除失敗：'+(e.message||'請檢查網路'));}
}

function removePhoto(prefix, idx) {
  const isClose = prefix.startsWith('close');
  const rowIndex = isClose ? prefix.slice(6) : null;
  const slotId = isClose ? `close-slot-${rowIndex}-${idx}` : `report-slot-${idx}`;
  const slot = document.getElementById(slotId);
  slot.innerHTML = '<span class="photo-add">+</span>';
  if (photoData[prefix]) photoData[prefix][idx] = null;
  if (idx === 0) {
    if (photoData[prefix]) photoData[prefix][1] = null;
    const slot1Id = isClose ? `close-slot-${rowIndex}-1` : 'report-slot-1';
    const slot1 = document.getElementById(slot1Id);
    if (slot1) { slot1.innerHTML = '<span class="photo-add">+</span>'; }
  }
}

function compressImage(file, maxSize, quality) {
  return new Promise((resolve, reject) => {
    // 原始檔案過大時直接提示，避免瀏覽器處理超大圖片卡死
    const MAX_RAW_MB = 15;
    if (file.size > MAX_RAW_MB * 1024 * 1024) {
      reject(new Error('FILE_TOO_LARGE'));
      return;
    }
    const reader = new FileReader();
    const timeout = setTimeout(() => reject(new Error('TIMEOUT')), 15000);
    reader.onerror = () => { clearTimeout(timeout); reject(new Error('READ_ERROR')); };
    reader.onload = e => {
      const img = new Image();
      img.onerror = () => { clearTimeout(timeout); reject(new Error('IMAGE_ERROR')); };
      img.onload = () => {
        clearTimeout(timeout);
        let w = img.width, h = img.height;
        if (w > maxSize || h > maxSize) {
          if (w > h) { h = Math.round(h * maxSize / w); w = maxSize; }
          else { w = Math.round(w * maxSize / h); h = maxSize; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function getClosePhotos(rowIndex) {
  const key = 'close-' + rowIndex;
  return photoData[key] ? photoData[key].filter(Boolean) : [];
}

function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}

</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try {
      // v5 Service Worker 不攔截 fetch；query 版本號 + updateViaCache:none 可強制瀏覽器取得新版本，
      // 避免舊的 cache-first SW 繼續控制 Apps Script redirect 請求。
      const reg = await navigator.serviceWorker.register('sw.js?v=5', { updateViaCache: 'none' });
      await reg.update();
    } catch (e) {
      console.log('SW update error:', e);
    }
  });
}
</script>
