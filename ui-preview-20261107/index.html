<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ASPIRE-REPAIR｜暖橘色 UI 安全預覽</title>
<style>
:root{--bg:#f7f3ed;--card:#fffdfa;--ink:#314650;--sub:#738086;--line:#e9e0d4;--orange:#cd793d;--pale:#fff0e1;--shadow:0 7px 25px #654c2c12}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,'Noto Sans TC','Microsoft JhengHei',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #d79762;outline-offset:2px}.layout{display:flex;min-height:100vh}.side{width:245px;background:var(--card);border-right:1px solid var(--line);padding:24px 14px;position:sticky;top:0;height:100vh;flex-shrink:0}.logo{display:flex;align-items:center;gap:12px;margin:4px 10px 35px}.logoMark{background:linear-gradient(145deg,#e7ac6d,#bd6a33);color:white;width:43px;height:43px;border-radius:15px;display:grid;place-items:center;font-size:23px;font-weight:900}.logo strong{font-size:15px;letter-spacing:.02em}.logo strong em{font-style:normal;color:var(--orange)}.logo small{display:block;color:#9b988b;font-size:10px;letter-spacing:2px}.navLabel{color:#b2a08e;font-size:11px;margin:0 16px 12px;letter-spacing:2px}.nav{display:block;width:100%;text-align:left;border:0;background:none;color:#7b817f;padding:13px 16px;margin:4px 0;border-radius:12px;font-weight:650}.nav.active{background:#fff0e0;color:#ad6330}.nav:hover{background:#f9f1e8}.sideFoot{position:absolute;bottom:22px;left:15px;right:15px;padding:17px;border-radius:17px;background:#f8f0e5;font-size:12px;color:#826e59}.main{flex:1;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:19px 33px;background:#fffcf9;border-bottom:1px solid var(--line)}.crumb{font-size:11px;color:#a69483}.top h1{margin:2px 0 0;font-size:21px}.tag{font-size:11px;padding:5px 11px;background:#fff1e0;color:#a9652f;border:1px solid #ebd3b9;border-radius:99px;font-weight:700}.container{max-width:1240px;margin:auto;padding:30px}.banner{background:linear-gradient(125deg,#f5e2ce,#fff7ed);padding:28px 33px;border-radius:24px;position:relative;overflow:hidden;margin-bottom:24px}.banner:after{content:'';width:230px;height:230px;border:38px solid #ffffff48;border-radius:50%;position:absolute;right:-70px;top:-95px}.banner h2{font-size:26px;margin:4px 0 9px}.banner p{color:#927c68;margin:0 0 18px}.eyebrow{font-size:11px;color:#b47740;letter-spacing:2px;font-weight:800}.btn{border:1px solid #e6dacf;border-radius:12px;padding:11px 16px;background:#fffdfa;color:#51666b;font-weight:700;min-height:43px}.btn.primary{background:linear-gradient(135deg,#df8c4d,#be6b32);border-color:#c7773b;color:white;box-shadow:0 4px 14px #b76f3b25}.btn:disabled{opacity:.5;cursor:not-allowed}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:23px}.stat,.panel,.room{background:var(--card);border:1px solid var(--line);border-radius:19px;box-shadow:var(--shadow)}.stat{padding:20px}.stat .mini{color:#a59281;font-size:12px}.stat b{font-size:31px;display:block;margin:8px 0 2px}.stat small{font-size:11px;color:#b47c52}.panel{padding:23px;margin-bottom:20px}.panel h3{font-size:18px;margin:0 0 6px}.muted{color:#87928f;font-size:12px;margin:0 0 19px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:19px 0}.filters input{flex:1;min-width:190px}.field,input,select,textarea{border:1px solid #dfdcd4;border-radius:12px;background:#fffdfa;color:#344d54;min-height:45px;padding:10px 13px}input,select,textarea{max-width:100%}textarea{min-height:100px;resize:vertical}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:730px}th{text-align:left;background:#faf6f0;color:#938575;font-size:12px;font-weight:650;padding:13px 12px}td{border-top:1px solid #f0e9df;padding:15px 12px;font-size:13px}tr[data-id]{cursor:pointer}tr[data-id]:hover{background:#fff8f0}td small{display:block;color:#a89888}.badge{display:inline-block;border-radius:99px;font-size:11px;padding:4px 9px;background:#fff2e0;color:#9e632b}.badge.blue{background:#eef5fa;color:#477394}.badge.green{background:#ecf6ef;color:#477a5b}.badge.purple{background:#f4effa;color:#78578a}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:17px}.formgrid label{display:flex;flex-direction:column;gap:7px;color:#63747a;font-weight:700;font-size:13px}.formgrid label.full{grid-column:1/-1}.formgrid .choice{display:flex;gap:9px;flex-wrap:wrap}.choice button{background:#fcf8f2;border:1px solid #e4dacf;color:#617076;min-height:44px;padding:10px 15px;border-radius:11px}.choice button.on{background:#fff0df;border-color:#d7a675;color:#ab6839}.helper{font-size:12px;color:#a4917d}.sections{display:grid;grid-template-columns:1fr 1fr;gap:16px}.roomgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.room{padding:22px;text-align:left}.room b{font-size:27px;display:block}.room small{color:#998778}.room .detail{border-top:1px solid #eee5db;margin-top:16px;padding-top:13px;font-size:13px}.bars .barline{display:flex;align-items:center;gap:13px;margin:16px 0}.bars .barline span{width:80px}.bars .track{flex:1;background:#f7eee5;height:13px;border-radius:99px;overflow:hidden}.bars .fill{height:100%;background:linear-gradient(90deg,#e6ae7e,#cd793d);border-radius:99px}.bars .barline b{min-width:45px;text-align:right}.history{border-left:2px solid #f1d2b1;margin-left:13px;padding-left:20px}.histrow{background:#fffdfa;border:1px solid var(--line);border-radius:14px;padding:17px;margin:16px 0}.footer{text-align:center;color:#ad9d8c;font-size:11px;margin:24px}.shade{position:fixed;inset:0;background:#2b231a80;z-index:10;display:flex;justify-content:flex-end}.drawer{width:420px;max-width:100%;background:#fffdfa;height:100%;padding:28px;overflow:auto;box-shadow:-10px 0 45px #0002}.close{float:right;border:0;background:#f6ede2;border-radius:10px;padding:9px}#toast{position:fixed;bottom:20px;right:20px;background:#354a4b;color:white;padding:14px 20px;border-radius:12px;z-index:20;display:none}.mobilemenu{display:none}.hide{display:none!important}@media(max-width:1000px){.side{width:205px}.stats{grid-template-columns:repeat(2,1fr)}.sections{grid-template-columns:1fr}.roomgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.side{display:none}.top{padding:16px}.mobilemenu{display:block;border:1px solid #e9ddd0;background:white;border-radius:9px;padding:6px 12px}.container{padding:16px}.banner{padding:22px}.banner h2{font-size:22px}.formgrid{grid-template-columns:1fr}.formgrid label.full{grid-column:1}.roomgrid{grid-template-columns:1fr}.stats{gap:9px}.stat{padding:15px}.stat b{font-size:27px}.panel{padding:17px}.mobnav{display:flex!important;position:fixed;bottom:0;left:0;right:0;background:#fffdfa;border-top:1px solid #e6dacc;padding:6px;justify-content:space-around;z-index:8}.mobnav button{border:0;background:transparent;padding:8px 4px;font-size:11px;color:#68777a}.mobnav button.active{color:#bd773d;font-weight:800}.main{padding-bottom:70px}}.mobnav{display:none}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body>
<div class="layout"><aside class="side"><div class="logo"><span class="logoMark">A</span><span><strong>ASPIRE <em>REPAIR</em></strong><small>設施維修管理平台</small></span></div><div class="navLabel">工作空間</div><div id="nav"></div><div class="sideFoot"><b>溫暖精緻的工作日常 ✦</b><div style="margin-top:5px">安心預覽，所有案件均為虛構資料。</div></div></aside>
<main class="main"><header class="top"><div><div class="crumb">ASPIRE-REPAIR / UI 安全預覽</div><h1 id="pageTitle">總覽</h1></div><span class="tag">DEMO · 不連正式資料</span></header><div class="container" id="content"></div></main></div><div class="mobnav" id="mobnav"></div><div id="detail" class="hide"></div><div id="toast" role="status"></div>
<script>
'use strict';
const tabs=[['form','✚ 新增報修'],['manage','▤ 修繕管理'],['query','⌕ 案件查詢'],['rooms','▦ 房間看板'],['history','◷ 位置病歷'],['stats','▥ 統計分析']];
const records=[
{id:'AR-260917',site:'會館',room:'603',title:'浴室排水速度緩慢',status:'待處理',who:'阿賢',type:'給排水',time:'11/06 09:20',priority:true},
{id:'AR-260916',site:'研究園',room:'A棟 2F',title:'空調送風機異音檢查',status:'處理中',who:'賓瞬',type:'空調設備',time:'11/06 08:45'},
{id:'AR-260915',site:'雅舍',room:'雅2 508',title:'浴室拉門緩衝器異常',status:'待處理',who:'阿振',type:'門窗五金',time:'11/05 16:40'},
{id:'AR-260914',site:'智尊',room:'B1',title:'停車場照明不亮',status:'已完成',who:'嘉榮',type:'電氣設備',time:'11/05 13:15'},
{id:'AR-260913',site:'會館',room:'512',title:'房間冷氣出風溫度偏高',status:'轉總務',who:'總務',type:'空調設備',time:'11/05 11:20'},
{id:'AR-260912',site:'研究園',room:'B棟 1F',title:'感應門開啟反應延遲',status:'處理中',who:'阿賢',type:'弱電門禁',time:'11/04 15:10',priority:true}
];
let active='form',q='',area='全部場域',state='全部狀態',locType='房間',formArea='會館';
const el=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const notify=s=>{el('toast').textContent=s;el('toast').style.display='block';setTimeout(()=>el('toast').style.display='none',3000)};
const badge=s=>'<span class="badge '+(s==='處理中'?'blue':s==='已完成'?'green':s==='轉總務'?'purple':'')+'">'+esc(s)+'</span>';
const metrics='<div class="stats">'+[['報修案件','238','本月累積'],['待處理','28','待安排處理'],['處理中','17','持續追蹤'],['已完成','193','完成率 81.1%']].map(a=>'<div class="stat"><span class="mini">'+a[0]+'</span><b>'+a[1]+'</b><small>'+a[2]+'</small></div>').join('')+'</div>';
function nav(page){active=page;q='';area='全部場域';state='全部狀態';el('pageTitle').textContent=tabs.find(t=>t[0]===page)[1].slice(2);el('nav').innerHTML=tabs.map(t=>'<button class="nav '+(t[0]===active?'active':'')+'" data-nav="'+t[0]+'">'+t[1]+'</button>').join('');el('mobnav').innerHTML=tabs.slice(0,4).map(t=>'<button class="'+(t[0]===active?'active':'')+'" data-nav="'+t[0]+'">'+t[1]+'</button>').join('');render()}
function filtered(){return records.filter(r=>(r.title+r.room+r.site+r.id+r.type).toLowerCase().includes(q.toLowerCase())&&(area==='全部場域'||r.site===area)&&(state==='全部狀態'||r.status===state))}
function controls(){return '<div class="filters"><input id="search" placeholder="搜尋房號、設備、報修內容…" value="'+esc(q)+'" aria-label="搜尋"><select id="area"><option>全部場域</option>'+['會館','研究園','雅舍','智尊'].map(s=>'<option '+(area===s?'selected':'')+'>'+s+'</option>').join('')+'</select><select id="state"><option>全部狀態</option>'+['待處理','處理中','已完成','轉總務'].map(s=>'<option '+(state===s?'selected':'')+'>'+s+'</option>').join('')+'</select><button class="btn" id="reset">清除</button></div>'}
function table(){let arr=filtered();return '<div class="tablewrap"><table><thead><tr>'+['報修事項','位置','分類','狀態','處理人','時間'].map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+arr.map(r=>'<tr data-id="'+r.id+'"><td><b>'+esc(r.title)+'</b>'+(r.priority?' <span class="badge">優先</span>':'')+'<small>'+r.id+'</small></td><td>'+r.site+'<small>'+r.room+'</small></td><td>'+r.type+'</td><td>'+badge(r.status)+'</td><td>'+r.who+'</td><td>'+r.time+'</td></tr>').join('')+'</tbody></table></div>'+(arr.length?'':'<p class="muted" style="text-align:center;padding:25px">沒有符合條件的案件</p>')}
function panel(title,desc,inside){return '<section class="panel"><h3>'+title+'</h3><p class="muted">'+desc+'</p>'+inside+'</section>'}
function form(){return '<section class="banner"><div class="eyebrow">NEW REPAIR REQUEST ✦</div><h2>讓每件報修，都被細心照顧。</h2><p>以清楚、熟悉的欄位快速完成報修。</p><span class="tag">安全預覽 · 無法真正送出</span></section><form id="reportForm">'+panel('01 · 報修人資料','填寫報修基本資訊','<div class="formgrid"><label>報修人姓名<input required placeholder="例如：王先生"></label><label>單位<input required placeholder="例如：會館"></label><label>電子郵件（選填）<input type="email" placeholder="name@example.com"></label><label>報修日期<input type="date" value="2026-11-07"></label></div>')+panel('02 · 報修位置','依照實際場域，選擇位置與樓層','<div class="formgrid"><label>場域<select id="formArea">'+['會館','研究園','雅舍','智尊','其他'].map(x=>'<option '+(x===formArea?'selected':'')+'>'+x+'</option>').join('')+'</select></label><label>位置類型<div class="choice" id="locChoice">'+['房間','公共區域','設備'].map(x=>'<button type="button" data-loc="'+x+'" class="'+(locType===x?'on':'')+'">'+x+'</button>').join('')+'</div></label><label>房號／區域<input required placeholder="例如：603、A棟 2F"></label><label>設備類別<select><option>請選擇</option><option>給排水</option><option>空調設備</option><option>電氣設備</option><option>門窗五金</option></select></label></div>')+panel('03 · 問題描述','描述設備狀況與發生位置','<div class="formgrid"><label class="full">報修內容<textarea required placeholder="請描述異常現象，例如浴室排水速度變慢…"></textarea></label><label class="full">上傳照片（展示選擇介面，不會上傳）<input type="file" accept="image/*" multiple id="photos"><span class="helper" id="photoHint">照片只會顯示檔名，不會儲存或傳送。</span></label></div>')+panel('04 · 送出報修','僅預覽介面，不會建立實際案件','<button type="submit" class="btn primary" style="width:100%">送出報修（示範）</button>')+'</form>'}
function render(){let html='';if(active==='form')html=form();
if(active==='manage'||active==='query')html='<section class="banner"><div class="eyebrow">MAINTENANCE WORKSPACE</div><h2>'+(active==='manage'?'快速掌握每件修繕進度':'找到每一筆需要的案件')+'</h2><p>保留原本案件資訊、狀態與處理方式。</p></section>'+metrics+panel(active==='manage'?'修繕案件列表':'案件查詢','點選任一案件可查看詳情，所有操作僅展示',controls()+'<div id="tableRegion">'+table()+'</div>');
if(active==='rooms')html='<section class="banner"><div class="eyebrow">ROOM OVERVIEW</div><h2>會館房間看板</h2><p>以房號為核心，同房多筆故障清楚呈現。</p></section>'+panel('房況總覽','依房號查看維修狀態，點選可查看示範詳情','<div class="roomgrid">'+[['603','會館','2 件待處理','浴室排水速度緩慢；衛浴燈具不亮'],['512','會館','1 件轉總務','房間冷氣出風溫度偏高'],['508','雅舍','1 件待處理','浴室拉門緩衝器異常'],['A-201','研究園','1 件處理中','空調送風機異音'],['B1','智尊','已完成','停車場照明不亮'],['605','會館','無待處理','目前沒有待處理案件']].map(a=>'<button class="room" data-room="'+a[0]+'"><small>'+a[1]+'</small><b>'+a[0]+'</b><span class="badge">'+a[2]+'</span><div class="detail">'+a[3]+'</div></button>').join('')+'</div>');
if(active==='history')html='<section class="banner"><div class="eyebrow">LOCATION HISTORY</div><h2>每個位置，都有自己的維修紀錄。</h2><p>同一位置的歷史案件，可以沿時間順序追蹤。</p></section>'+panel('位置病歷表','示範資料，可依場域及案件搜尋',controls()+'<div id="tableRegion"><div class="history">'+filtered().map(r=>'<div class="histrow"><b>'+r.site+' · '+r.room+'</b><small style="float:right">'+r.time+'</small><p>'+r.title+'</p>'+badge(r.status)+'</div>').join('')+'</div></div>');
if(active==='stats')html='<section class="banner"><div class="eyebrow">OPERATIONS INSIGHT</div><h2>看得清楚，決策更有方向。</h2><p>統一的暖橘色資訊層級，讓管理數據更易閱讀。</p></section>'+metrics+'<div class="sections">'+panel('各場域案件占比','示範資料，非實際統計','<div class="bars">'+[['會館',82,34],['研究園',68,29],['雅舍',53,22],['智尊',35,15]].map(a=>'<div class="barline"><span>'+a[0]+'</span><div class="track"><div class="fill" style="width:'+a[2]+'%"></div></div><b>'+a[2]+'%</b></div>').join('')+'</div>')+panel('維修類別排行','示範資料，不代表真實績效','<div class="bars">'+[['空調設備',72],['給排水',57],['電氣設備',48],['門窗五金',35],['弱電門禁',26]].map(a=>'<div class="barline"><span>'+a[0]+'</span><div class="track"><div class="fill" style="width:'+a[1]+'%"></div></div><b>'+a[1]+'件</b></div>').join('')+'</div>')+'</div>';
el('content').innerHTML=html+'<div class="footer">ASPIRE-REPAIR · 溫暖橘色 UI 純展示版 · 無任何正式 API 呼叫</div>'}
function detail(record){el('detail').className='shade';el('detail').innerHTML='<div class="drawer"><button class="close" id="close">✕</button><div class="eyebrow">REPAIR CASE · '+esc(record.id)+'</div><h2>案件詳情</h2><div class="banner"><h3>'+esc(record.title)+'</h3>'+badge(record.status)+'</div>'+[['場域',record.site],['位置',record.room],['類別',record.type],['處理人',record.who],['報修時間',record.time]].map(a=>'<div style="display:flex;justify-content:space-between;gap:15px;border-bottom:1px solid #efe4d7;padding:15px 0"><span style="color:#96877a">'+a[0]+'</span><b>'+esc(a[1])+'</b></div>').join('')+'<div style="padding:35px;background:#faf4ec;text-align:center;border-radius:14px;margin-top:20px;color:#aa998a">照片展示區（無真實照片）</div><button id="demoEdit" class="btn primary" style="width:100%;margin-top:22px">編輯案件（示範）</button></div>'}
document.addEventListener('click',e=>{const n=e.target.closest('[data-nav]');if(n){nav(n.dataset.nav);return}const l=e.target.closest('[data-loc]');if(l){locType=l.dataset.loc;document.querySelectorAll('[data-loc]').forEach(b=>b.classList.toggle('on',b===l));return}const row=e.target.closest('[data-id]');if(row){let r=records.find(x=>x.id===row.dataset.id);if(r)detail(r);return}if(e.target.closest('[data-room]')){notify('此房間為展示資料，不會修改正式系統');return}if(e.target.id==='close'||e.target.id==='detail'){el('detail').className='hide';return}if(e.target.id==='demoEdit'){notify('展示版不允許修改正式案件');return}if(e.target.id==='reset'){q='';area='全部場域';state='全部狀態';render()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){q=e.target.value;const region=el('tableRegion');if(region)region.innerHTML=active==='history'?'<div class="history">'+filtered().map(r=>'<div class="histrow"><b>'+r.site+' · '+r.room+'</b><p>'+r.title+'</p>'+badge(r.status)+'</div>').join('')+'</div>':table()}if(e.target.id==='photos')el('photoHint').textContent=(e.target.files?.length||0)+' 張已選擇（不會上傳）'});
document.addEventListener('change',e=>{if(e.target.id==='area'){area=e.target.value;render()}if(e.target.id==='state'){state=e.target.value;render()}if(e.target.id==='formArea'){formArea=e.target.value}});
document.addEventListener('submit',e=>{if(e.target.id==='reportForm'){e.preventDefault();notify('展示送出完成：沒有建立案件，也沒有上傳任何資料。')}});
nav('form');
</script></body></html>
